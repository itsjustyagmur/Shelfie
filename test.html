<script>
(function () {
  const originalOpen = openDetail;
  const bookCache = new Map();

  async function loadBookDetails(book) {
    if (bookCache.has(book.id)) {
      return bookCache.get(book.id);
    }

    const task = (async () => {
      const olId = String(book.id)
        .replace(/^openlibrary_/, '');

      let result = null;

      try {
        if (/^OL\d+W$/i.test(olId)) {
          const response = await fetch(
            'https://openlibrary.org/works/' + olId + '.json'
          );
          if (response.ok) result = await response.json();
        }

        if (!result) {
          const response = await fetch(
            'https://openlibrary.org/search.json?' +
            new URLSearchParams({
              title: book.title,
              limit: '5',
              fields: 'key,title,author_name,first_publish_year,cover_i'
            })
          );

          if (response.ok) {
            const search = await response.json();
            const match = (search.docs || []).find(d =>
              d.title?.toLowerCase() === book.title.toLowerCase()
            ) || search.docs?.[0];

            if (match) {
              book.author = book.author ||
                match.author_name?.join(', ') || '';
              book.year = book.year ||
                match.first_publish_year || '';
              if (match.cover_i &&
                  (!book.cover || book.cover.includes('placehold.co'))) {
                book.cover =
                  'https://covers.openlibrary.org/b/id/' +
                  match.cover_i + '-M.jpg';
              }

              const workResponse = await fetch(
                'https://openlibrary.org' + match.key + '.json'
              );
              if (workResponse.ok) {
                result = await workResponse.json();
              }
            }
          }
        }

        if (result) {
          const description = result.description;
          book.description = book.description ||
            (typeof description === 'string'
              ? description
              : description?.value || '');

          if (result.covers?.[0] &&
              (!book.cover || book.cover.includes('placehold.co'))) {
            book.cover =
              'https://covers.openlibrary.org/b/id/' +
              result.covers[0] + '-M.jpg';
          }

          if (!book.author && result.authors?.length) {
            const authors = await Promise.all(
              result.authors.slice(0, 3).map(async a => {
                const key = a.author?.key || a.key;
                if (!/^\/authors\/OL\d+A$/.test(key || '')) {
                  return '';
                }
                const response = await fetch(
                  'https://openlibrary.org' + key + '.json'
                );
                if (!response.ok) return '';
                const data = await response.json();
                return data.name || '';
              })
            );
            book.author = authors.filter(Boolean).join(', ');
          }
        }
      } catch (error) {
        console.warn('Book details unavailable:', error);
      }

      return book;
    })();

    bookCache.set(book.id, task);
    return task;
  }

  window.shelfieOpenRatedBook = async function(id, title) {
    let book = item(id);

    if (!book) {
      book = {
        id,
        title,
        type: 'Book',
        author: '',
        year: '',
        genre: '',
        description: '',
        cover: 'https://placehold.co/120x180/38213f/f8b5e4?text=Shelfie'
      };
      catalog.push(book);
    }

    originalOpen(id);

    await loadBookDetails(book);

    // Refresh only if the same book is still open.
    const popup = document.querySelector('#overlay .modal');
    if (popup && popup.textContent.includes(book.title)) {
      originalOpen(id);
    }
  };

  // Enrich any book opened normally, too.
  openDetail = function(id) {
    const book = item(id);
    if (!book || book.type !== 'Book') {
      return originalOpen(id);
    }

    return shelfieOpenRatedBook(id, book.title);
  };

  // Handle rated-book cards even when the book is missing
  // from the local catalog.
  document.addEventListener('click', function(event) {
    const button = event.target.closest(
      '.shelfie-book-button'
    );
    if (!button || !button.closest('#overlay')) return;

    const action = button.getAttribute('onclick') || '';
    const match = action.match(
      /^openDetail\('([^']+)'\)$/
    );
    if (!match) return;

    const id = match[1];
    if (item(id)) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const title = button.textContent
      .replace(/[📖★☆]/g, '')
      .trim().split('\n')[0].trim();

    shelfieOpenRatedBook(id, title);
  }, true);
})();
</script>



 

<!-- Shelfie: keep ratings synchronized across account, profile and book detail -->

<!-- ============================================================
     SHELFIE · 46 · Cloud rating persistence and synchronization
     ============================================================ -->
<script>
(function () {
  let syncing = null;
  let syncedUser = null;
  const previousRefresh = refreshCloud;
  const previousBookRate = window.shelfieBookRate;
  const previousSubmit = submitReview;

  async function syncMyRatings() {
    if (!cloud || !cloudUser) return;
    const userId = cloudUser.id;
    if (syncing && syncedUser === userId) return syncing;
    syncedUser = userId;
    syncing = (async function () {
      const {data, error} = await cloud.from('ratings')
        .select('title_id,title_name,stars,review,created_at')
        .eq('user_id', userId);
      if (error) { console.warn('Shelfie rating sync:', error); return; }
      if (cloudUser?.id !== userId) return;
      let changed = false;
      for (const r of data || []) {
        if (!r.title_id) continue;
        const old = state.reviews.find(x => x.id === r.title_id);
        if (!old || old.stars !== r.stars || old.text !== (r.review || '')) {
          state.reviews = state.reviews.filter(x => x.id !== r.title_id);
          state.reviews.push({id:r.title_id, stars:r.stars,
            text:r.review || '', date:'Recently'});
          changed = true;
        }
      }
      if (changed) { save(); if (tab === 'Profile') render(); }
    })();
    try { await syncing; } finally { syncing = null; }
  }

  refreshCloud = async function () {
    await previousRefresh();
    await syncMyRatings();
  };

  window.shelfieBookRate = async function (id, stars) {
    const book = item(id);
    if (!book) { toast('Book not loaded yet. Search for it again.'); return; }
    if (!cloudUser) { previousBookRate(id, stars); return; }

    const existing = state.reviews.find(r => r.id === id);
    const reviewText = existing?.text || '';
    const {error} = await cloud.from('ratings').upsert({
      user_id:cloudUser.id, title_id:id, title_name:book.title,
      media_type:'book', stars, review:reviewText
    }, {onConflict:'user_id,title_id'});
    if (error) { toast('Rating not saved: ' + error.message); return; }

    state.reviews = state.reviews.filter(r => r.id !== id);
    state.reviews.push({id, stars, text:reviewText, date:'Just now'});
    save();
    openDetail(id);
    toast('Your ' + stars + '-star rating was saved ♡');
    await refreshCloud();
  };

  submitReview = async function (id) {
    await previousSubmit(id);
    await syncMyRatings();
  };

  // Restore account ratings on page load and whenever sign-in changes.
  setTimeout(() => syncMyRatings(), 600);
  if (cloud?.auth) cloud.auth.onAuthStateChange(() => {
    setTimeout(() => syncMyRatings(), 700);
  });
})();
</script>

<script>
(function () {
  if (!document.documentElement.classList.contains('shelfie-profile-boot')) return;
  let done = false;
  function reveal() {
    if (done) return;
    done = true;
    document.documentElement.classList.remove('shelfie-profile-boot');
    clearInterval(check);
    clearTimeout(fallback);
  }
  // Never trap the user behind a loading screen.
  const fallback = setTimeout(reveal, 3000);
  const check = setInterval(function () {
    if (!cloud || !cloudUser) {
      if (cloudReady) reveal();
      return;
    }
    // Only show the signed-in profile after the actual account profile arrives.
    if (cloudProfile && cloudProfile.id === cloudUser.id) reveal();

<!-- SHELFIE MIGRATION · Stage 3: cloud library (staging, legacy data retained) -->
<script>
(function () {
  'use strict';
  const library = new Map();
  let legacySnapshot = null;
  let loadedFor = null;
  let loading = null;
  const mediaType = x => x?.type === 'Book' ? 'book' : x?.type === 'Movie' ? 'movie' : 'show';
  const libraryKey = (type,id) => type + ':' + id;
  const lookup = id => { const x = item(id); return x ? library.get(libraryKey(mediaType(x), id)) : null; };
  const metadataFor = x => ({author:x.author||'',cover:x.cover||'',year:x.year||'',genre:x.genre||'',description:x.description||'',workKey:x.workKey||'',fallback:x.fallback||''});
  function hydrate(rows) {
    library.clear();
    for (const r of rows || []) {
      library.set(libraryKey(r.media_type,r.title_id), r);
      if (!item(r.title_id)) catalog.push({id:r.title_id,title:r.title_name,type:r.media_type==='book'?'Book':r.media_type==='movie'?'Movie':'Show',...r.metadata});
    }
    // Capture the current browser state before replacing visible lists.
    if (!legacySnapshot) legacySnapshot = {saved:[...(state.saved||[])],completed:[...(state.completed||[])]};
    // Cloud is authoritative only after a successful fetch. Legacy browser data is not erased.
    state.saved = [...library.values()].filter(r=>['tbr','watchlist'].includes(r.status)).map(r=>r.title_id);
    state.completed = [...library.values()].filter(r=>['read','watched'].includes(r.status)).map(r=>r.title_id);
  }
  async function loadLibrary() {
    if (!cloud || !cloudUser) { loadedFor=null; library.clear(); return; }
    const userId=cloudUser.id;
    if (loading && loadedFor===userId) return loading;
    loadedFor=userId;
    loading=(async()=>{
      const {data,error}=await cloud.from('shelfie_library').select('user_id,media_type,title_id,title_name,status,metadata,created_at,updated_at').eq('user_id',userId);
      if (error) throw error;
      if (cloudUser?.id!==userId) return;
      hydrate(data);
      render();
    })();
    try { await loading; } catch(e) { console.error('Shelfie cloud library read:',e); toast('Could not load cloud library: '+e.message); loadedFor=null; }
    finally { loading=null; }
  }
  async function setStatus(id,status) {
    if (!cloudUser) { openAccount(); toast('Sign in to save your library in the cloud ♡'); return; }
    const x=item(id);
    if (!x) { toast('Search for this title again first'); return; }
    const userId=cloudUser.id, type=mediaType(x), key=libraryKey(type,id), existing=library.get(key);
    const next=existing?.status===status ? 'none' : status;
    const result=next==='none'
      ? await cloud.from('shelfie_library').delete().eq('user_id',userId).eq('media_type',type).eq('title_id',id)
      : await cloud.from('shelfie_library').upsert({user_id:userId,media_type:type,title_id:id,title_name:x.title,status:next,metadata:metadataFor(x),updated_at:new Date().toISOString()},{onConflict:'user_id,media_type,title_id'});
    if (result.error) { toast('Could not save to Supabase: '+result.error.message); return; }
    if (cloudUser?.id!==userId) return;
    if(next==='none') library.delete(key);
    else library.set(key,{user_id:userId,media_type:type,title_id:id,title_name:x.title,status:next,metadata:metadataFor(x)});
    hydrate([...library.values()]);
    openDetail(id); render(); toast('Saved to your Shelfie cloud ♡');
  }
  window.shelfieBookStatus=(id,status)=>setStatus(id,status);
  window.shelfieMarkFinished=id=>setStatus(id,'watched');
  toggleSave=id=>{ const x=item(id); return setStatus(id,x?.type==='Book'?'tbr':'watchlist'); };
  const previousOpenDetail=openDetail;
  openDetail=function(id){
    previousOpenDetail(id);
    const x=item(id); if(!x) return;
    const current=lookup(id)?.status||'none';
    const buttons=[...document.querySelectorAll('.modal button')];
    if(x.type==='Book'){
      const read=buttons.find(b=>b.getAttribute('onclick')?.includes("shelfieBookStatus('"+id+"', 'read')"));
      const tbr=buttons.find(b=>b.getAttribute('onclick')?.includes("shelfieBookStatus('"+id+"', 'tbr')"));
      if(read) read.textContent=current==='read'?'✓ Read':'✓ Mark as Read';
      if(tbr) tbr.textContent=current==='tbr'?'♥ In TBR':'♡ Add to TBR';
    }else{
      const watched=buttons.find(b=>b.textContent.includes('Mark as Watched')||b.textContent.includes('Watched · Undo'));
      if(watched) watched.textContent=current==='watched'?'✓ Watched · Undo':'✓ Mark as Watched';
      const saved=buttons.find(b=>b.getAttribute('onclick')?.includes("toggleSave('"+id+"')"));
      if(saved) saved.textContent=current==='watchlist'?'✓ In Watchlist':'＋ Add to Watchlist';
    }
  };
  // Deliberately NO automatic import: old browser records may be prototypes or belong to another user.
  window.shelfieImportLibraryPreview=function(){
    if(!cloudUser){openAccount();return;}
    const candidates=new Map();
    function offer(id,status){const x=item(id);if(!x)return;const k=libraryKey(mediaType(x),id);if(library.has(k))return; candidates.set(k,{id,status,title:x.title});}
    for(const id of (legacySnapshot?.saved||state.saved||[])) offer(id,item(id)?.type==='Book'?'tbr':'watchlist');
    for(const id of (legacySnapshot?.completed||state.completed||[])) offer(id,item(id)?.type==='Book'?'read':'watched');
    try { const raw=JSON.parse(localStorage.getItem('shelfie-book-statuses-'+cloudUser.id)||'{}');for(const [id,status] of Object.entries(raw))if(['read','tbr'].includes(status))offer(id,status); } catch(_){}
    const rows=[...candidates.values()];
    modal('Import existing library ♡', `<p class="muted">These ${rows.length} browser-only items are not yet in your Supabase library. Review them before importing. Existing cloud entries will never be overwritten.</p>${rows.map(r=>`<p class="tiny">${esc(r.title)} — ${esc(r.status)}</p>`).join('')||'<p>Nothing to import from this browser.</p>'}${rows.length?'<button class="primary full" id="shelfieConfirmImport">Import these items to Supabase</button>':''}<p class="cloudhint">Keep your old browser data until you verify everything on another device.</p>`);
    const btn=document.getElementById('shelfieConfirmImport');
    if(btn)btn.onclick=async()=>{
      btn.disabled=true;
      const userId=cloudUser.id;let count=0;
      for(const r of rows){
        if(cloudUser?.id!==userId)break;
        const x=item(r.id);if(!x)continue;
        const {error}=await cloud.from('shelfie_library').upsert({user_id:userId,media_type:mediaType(x),title_id:r.id,title_name:x.title,status:r.status,metadata:metadataFor(x)},{onConflict:'user_id,media_type,title_id',ignoreDuplicates:true});
        if(error){toast('Import stopped: '+error.message);break;}count++;
      }
      closeModal();await loadLibrary();toast(count+' library items imported ♡');
    };
  };
  // Accessible from settings without modifying other Shelfie functionality.
  const settings=document.getElementById('shelfieSettings');
  if(settings){const oldClick=settings.onclick;settings.onclick=function(e){oldClick?.call(this,e);if(cloudUser){const target=document.querySelector('.modal');if(target){const b=document.createElement('button');b.className='secondary full';b.style.marginTop='12px';b.textContent='☁️ Import browser library to Supabase';b.onclick=window.shelfieImportLibraryPreview;target.appendChild(b);}}};}
  const oldRefresh=refreshCloud;
  refreshCloud=async function(){await oldRefresh();await loadLibrary();};
  if(cloud?.auth)cloud.auth.onAuthStateChange(()=>setTimeout(loadLibrary,350));
  setTimeout(loadLibrary,800);
})();
</script>

<script>
(function () {
  'use strict';

  let activity = [];
  let activityUser = null;
  let activityVersion = 0;
  const activityTargets = new Map();

  function dateLabel(value) {
    if (!value) return 'Date unavailable';
    const date = new Date(value);
    if (isNaN(date.getTime())) return 'Date unavailable';

    return date.toLocaleDateString(undefined, {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });
  }

  function activityHTML() {
    if (!cloudUser) {
      return '<div class="empty">Sign in to see your activity ♡</div>';
    }

    if (activityUser !== cloudUser.id) {
      return '<div class="empty">Loading your activity ♡</div>';
    }

    if (!activity.length) {
      return '<div class="empty">Your activity will appear here ♡</div>';
    }

    activityTargets.clear();
    return activity.map((a, index) => {
      activityTargets.set(index, a);
      return `
      <button type="button" class="shelfie-activity-entry shelfie-activity-link" onclick="shelfieNavigateActivity(${index})" aria-label="Open ${esc(a.title)}">
        <div class="eyebrow">${esc(a.label)}</div>
        <p>
          <strong>${esc(a.title)}</strong>
          ${a.details ? `<span> — ${esc(a.details)}</span>` : ''}
        </p>
        <div class="subtle">${dateLabel(a.date)}</div>
      </button>
    `;
    }).join('');
  }

  function replaceActivitySection(html) {
    const start = html.indexOf('<h2>✦ My Activity</h2>');
    if (start < 0) return html;

    const sectionStart = html.lastIndexOf(
      '<section class="shelfie-profile-section">', start
    );
    const sectionEnd = html.indexOf('</section>', start);

    if (sectionStart < 0 || sectionEnd < 0) return html;

    return html.slice(0, sectionStart) +
      `<section class="shelfie-profile-section">
        <h2>✦ My Activity</h2>
        ${activityHTML()}
      </section>` +
      html.slice(sectionEnd + '</section>'.length);
  }

  const previousProfile = profilePage;

  profilePage = function () {
    return replaceActivitySection(previousProfile());
  };

  async function loadActivity() {
    const user = cloudUser?.id;
    const version = ++activityVersion;

    if (!cloud || !user) {
      activity = [];
      activityUser = null;
      return;
    }

    const results = await Promise.all([
      cloud.from('shelfie_activity')
        .select('*')
        .eq('user_id', user)
        .order('created_at', {ascending:false})
        .limit(100),

      cloud.from('ratings')
        .select('id,title_id,title_name,media_type,stars,review,created_at,updated_at')
        .eq('user_id', user)
        .order('created_at', {ascending:false})
        .limit(100),

      cloud.from('shelfie_groups')
        .select('id,name,created_at')
        .eq('creator_id', user),

      cloud.from('shelfie_group_members')
        .select('group_id,created_at')
        .eq('user_id', user),

      cloud.from('shelfie_library')
        .select('title_id,title_name,media_type,status,created_at,updated_at')
        .eq('user_id', user)
    ]);

    if (version !== activityVersion ||
        cloudUser?.id !== user) return;

    const [history, ratings, groups, members, library] = results;

    const failures = results.filter(r => r.error);
    if (failures.length) {
      console.warn('Shelfie activity loading:', failures.map(r => r.error));
    }

    const entries = [];

    // Previously logged events, including status changes.
    for (const e of history.data || []) {
      entries.push({
        key: e.event_key || e.id,
        label: ({
          status: '✦ Status update',
          rating: '★ Rated',
          review: '★ Reviewed',
          group_created: '♧ Created a group',
          group_joined: '♧ Joined a group'
        })[e.event_type] || '✦ Shelfie activity',
        title: e.title || 'Shelfie',
        details: e.details || '',
        date: e.occurred_at || e.created_at,
        targetType: e.target_type || (e.event_type?.startsWith('group_') ? 'group' : e.event_type === 'status' ? 'profile' : 'title'),
        targetId: e.target_id || null,
        metadata: e.metadata || {}
      });
    }

    // Existing cloud ratings, including Little Women.
    for (const r of ratings.data || []) {
      entries.push({
        key: 'rating:' + r.id,
        label: '★ Rated a ' + (r.media_type || 'title'),
        title: r.title_name || 'Untitled',
        details: '★'.repeat(Math.min(5, Math.max(0, r.stars || 0))) +
          (r.review ? ' · ' + r.review : ''),
        date: r.updated_at || r.created_at,
        targetType: 'title', targetId: r.title_id, mediaType: r.media_type
      });
    }

    const groupNames = new Map(
      (groups.data || []).map(g => [String(g.id), g.name])
    );
    const ownedIds = new Set(
      (groups.data || []).map(g => String(g.id))
    );

    // Group names for memberships in groups created by others.
    const unknownIds = (members.data || [])
      .map(m => String(m.group_id))
      .filter(id => !groupNames.has(id));

    if (unknownIds.length) {
      const found = await cloud.from('shelfie_groups')
        .select('id,name')
        .in('id', [...new Set(unknownIds)]);

      for (const g of found.data || []) {
        groupNames.set(String(g.id), g.name);
      }
    }

    for (const g of groups.data || []) {
      entries.push({
        key: 'created:' + g.id,
        label: '♧ Created a group',
        title: g.name,
        details: '',
        date: g.created_at,
        targetType: 'group', targetId: g.id
      });
    }

    for (const m of members.data || []) {
      if (ownedIds.has(String(m.group_id))) continue;

      entries.push({
        key: 'joined:' + m.group_id,
        label: '♧ Joined a group',
        title: groupNames.get(String(m.group_id)) || 'Shelfie group',
        details: '',
        date: m.created_at,
        targetType: 'group', targetId: m.group_id
      });
    }

    // Existing library records.
    for (const r of library.data || []) {
      const label = r.status === 'read'
        ? '📖 Finished reading'
        : r.status === 'watched'
          ? '🎬 Finished watching'
          : '♡ Added to ' +
            (r.media_type === 'book' ? 'TBR' : 'watchlist');

      entries.push({
        key: 'library:' + r.media_type + ':' + r.title_id,
        label,
        title: r.title_name,
        details: '',
        date: r.updated_at || r.created_at,
        targetType: 'title', targetId: r.title_id, mediaType: r.media_type
      });
    }

    // Avoid displaying the same event twice when a logged
    // activity entry and an existing cloud record overlap.
    const seen = new Set();
    activity = entries
      .filter(e => {
        if (seen.has(e.key)) return false;
        seen.add(e.key);
        return true;
      })
      .sort((a,b) =>
        new Date(b.date || 0) - new Date(a.date || 0)
      )
      .slice(0,100);

    activityUser = user;

    if (tab === 'Profile') {
      const section = [...document.querySelectorAll(
        '#screen .shelfie-profile-section'
      )].find(el =>
        el.querySelector('h2')?.textContent.includes('My Activity')
      );

      if (section) {
        section.innerHTML =
          '<h2>✦ My Activity</h2>' + activityHTML();
      }
    }
  }


  window.shelfieNavigateActivity = async function(index) {
    const entry = activityTargets.get(index);
    if (!entry) return;
    const kind = String(entry.targetType || '').toLowerCase();
    const id = String(entry.targetId || '');
    if (kind.includes('status') || kind === 'profile') {
      go('Profile'); window.scrollTo({top:0,behavior:'smooth'}); return;
    }
    if (kind.includes('group') || entry.label.includes('group')) {
      let groupId = id;
      if (!groupId && cloud) {
        const {data} = await cloud.from('shelfie_groups').select('id,name')
          .eq('name', entry.title).limit(1);
        groupId = data?.[0]?.id || '';
      }
      if (groupId && typeof window.shelfieOpenSharedGroup === 'function') {
        await window.shelfieOpenSharedGroup(groupId);
      } else { go('Groups'); toast('Find this group in your groups ♡'); }
      return;
    }
    if (kind.includes('title') || kind.includes('book') || kind.includes('movie') ||
        kind.includes('show') || entry.label.includes('Rated') ||
        entry.label.includes('reading') || entry.label.includes('watch')) {
      let titleId = id;
      let book = titleId ? item(titleId) : null;
      if (!book && entry.title) {
        book = catalog.find(x => x.title.toLowerCase() === entry.title.toLowerCase());
        if (book) titleId = book.id;
      }
      if (book) { openDetail(titleId); return; }
      if (typeof window.shelfieOpenRatedBook === 'function' &&
          (entry.mediaType === 'book' || titleId.startsWith('openlibrary_'))) {
        window.shelfieOpenRatedBook(titleId, entry.title.replace(/^(?:Rated|Reviewed|Marked|Added)\s+/i, '').replace(/\s+to\s+(?:TBR|Watchlist)$/i, '')); return;
      }
      if (titleId && typeof window.shelfieOpenRatedBook === 'function') {
        window.shelfieOpenRatedBook(titleId, entry.title.replace(/^(?:Rated|Reviewed|Marked|Added)\s+/i, '').replace(/\s+to\s+(?:TBR|Watchlist)$/i, '')); return;
      }
      go('Search'); search = entry.title.replace(/^Rated\s+/i,'');
      const input = document.getElementById('searchInput');
      if (input) {input.value = search; updateResults();}
      toast('Search for this title ♡');
      return;
    }
    go('Profile'); window.scrollTo({top:0,behavior:'smooth'});
  };

  window.shelfieRefreshActivity = loadActivity;

  const previousGo = go;
  go = function (page) {
    previousGo(page);
    if (page === 'Profile') loadActivity();
  };

  const previousRender = render;
  render = function () {
    previousRender();
    if (tab === 'Profile' &&
        cloudUser &&
        activityUser !== cloudUser.id) {
      loadActivity();
    }
  };

  if (cloud?.auth) {
    cloud.auth.onAuthStateChange(() => {
      activityUser = null;
      activity = [];
      setTimeout(loadActivity, 500);
    });
  }

  setTimeout(loadActivity, 900);
})();
</script>

(function(){

  window.shelfieOpenImports=function(){

    modal('Import Data ♡',`<p class="muted">Bring your ratings and lists into your Shelfie account. Imports save to Supabase, not this device.</p>
      <button class="secondary full" onclick="shelfieGoodreadsImport()">📚 Goodreads · Import CSV →</button>
      <p class="cloudhint">Download your library CSV from Goodreads, then select it here. Review the import before saving.</p>
      <button class="secondary full" disabled style="opacity:.55;margin-top:8px">🎬 Letterboxd · Coming soon</button>
      <button class="secondary full" disabled style="opacity:.55;margin-top:8px">📺 Trakt · Coming soon</button>
      <button class="secondary full" disabled style="opacity:.55;margin-top:8px">★ IMDb · Coming soon</button>`);
  };
  function parseCSV(src){
    src=src.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;
    for(let i=0;i<src.length;i++){
      const c=src[i];
      if(c==='"'){if(quoted&&src[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}
      else if(c===','&&!quoted){row.push(field);field='';}
      else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&src[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field='';}
      else field+=c;
    }
    if(quoted)throw Error('CSV has an unclosed quoted field');
    row.push(field);if(row.some(v=>v.trim()))rows.push(row);
    if(!rows.length)return [];
    const headers=rows.shift().map(s=>s.trim());
    return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])));
  }
  const get=(r,k)=>String(r[k]||'').trim();
  const goodreadsId=r=>{const isbn=get(r,'ISBN13').replace(/[^0-9X]/gi,'')||get(r,'ISBN').replace(/[^0-9X]/gi,'');return isbn?'goodreads_isbn_'+isbn:'goodreads_'+get(r,'Book Id');};

  window.shelfiePreviewGoodreads=async function(file){

    try{
      if(file.size>8*1024*1024)throw Error('Please choose a CSV under 8 MB.');
      const rows=parseCSV(await file.text());
      if(!rows.length||!('Title' in rows[0])||!('Book Id' in rows[0]))throw Error('This does not look like a Goodreads library export.');
      pending=rows.filter(r=>get(r,'Title')&&get(r,'Book Id')).map(r=>{
        const shelf=get(r,'Exclusive Shelf').toLowerCase();
        const status=shelf==='read'?'read':shelf==='to-read'?'tbr':null;
        const stars=Number(get(r,'My Rating'));
        const rating=Number.isInteger(stars)&&stars>=1&&stars<=5?stars:null;
        return {id:goodreadsId(r),title:get(r,'Title'),author:get(r,'Author'),status,rating,review:get(r,'My Review'),date:get(r,'Date Read')||get(r,'Date Added')};
      });
      const ratings=pending.filter(r=>r.rating).length,lists=pending.filter(r=>r.status).length;
      target.innerHTML=`<p><b>${pending.length} books found</b><br>${ratings} star ratings · ${lists} Read / To-read statuses</p>
        <p class="muted tiny">Books on other shelves without a Read or To-read status are skipped. Existing Shelfie records are not overwritten. Goodreads dates are not imported yet.</p>
        <button id="shelfieImportConfirm" class="primary full" onclick="shelfieCommitGoodreads()">Import into my Supabase account</button>`;
    }catch(e){pending=[];target.textContent=e.message||'Could not read CSV';}
  };
  window.shelfieCommitGoodreads=async function(){
    if(!cloudUser||!cloud){toast('Sign in first');return;}
    const btn=document.getElementById('shelfieImportConfirm');if(btn)btn.disabled=true;
    const uid=cloudUser.id;let saved=0,skipped=0;
    try{
      for(const r of pending){
        if(cloudUser?.id!==uid)throw Error('Account changed; import stopped');
        if(!r.status&&!r.rating){skipped++;continue;}
        if(r.status){
          const {error}=await cloud.from('shelfie_library').upsert({user_id:uid,media_type:'book',title_id:r.id,title_name:r.title,status:r.status,metadata:{author:r.author}},{onConflict:'user_id,media_type,title_id',ignoreDuplicates:true});
          if(error)throw error;
        }
        if(r.rating){
          const {error}=await cloud.from('ratings').upsert({user_id:uid,title_id:r.id,title_name:r.title,media_type:'book',stars:r.rating,review:r.review},{onConflict:'user_id,title_id',ignoreDuplicates:true});
          if(error)throw error;
        }
        saved++;
      }
      pending=[];modal('Goodreads import complete ♡',`<p>${saved} books processed; ${skipped} skipped.</p><p class="muted">Saved to Supabase. Existing entries were not overwritten.</p><button class="primary full" onclick="closeModal();go('Profile')">View my profile ♡</button>`);
      if(typeof refreshCloud==='function')refreshCloud();
    }catch(e){toast('Import stopped: '+(e.message||'Unknown error'));if(btn)btn.disabled=false;}
  };
})();
</script>

<!-- Shelfie Goodreads import: resumable saving -->
<script>
(function () {
  const originalPreview = window.shelfiePreviewGoodreads;
  let importRows = [];

  // Capture the CSV again so a stopped import can be resumed.
  window.shelfiePreviewGoodreads = async function (file) {
    await originalPreview(file);
    importRows = [];

    if (!file || !document.getElementById('shelfieImportConfirm')) return;

    const text = await file.text();
    const rows = [];
    let row = [], field = '', quoted = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (c === '"') {
        if (quoted && text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = !quoted;
        }
      } else if (c === ',' && !quoted) {
        row.push(field);
        field = '';
      } else if ((c === '\n' || c === '\r') && !quoted) {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        if (row.some(x => x.trim())) rows.push(row);
        row = [];
        field = '';
      } else {
        field += c;
      }
    }

    row.push(field);
    if (row.some(x => x.trim())) rows.push(row);

    const headers = rows.shift().map(x => x.trim());
    const get = (r, name) => String(r[headers.indexOf(name)] || '').trim();

    importRows = rows.map(r => {
      const isbn = (
        get(r, 'ISBN13') || get(r, 'ISBN')
      ).replace(/[^0-9X]/gi, '');

      const shelf = get(r, 'Exclusive Shelf').toLowerCase();
      const rating = Number(get(r, 'My Rating'));

      return {
        id: isbn
          ? 'goodreads_isbn_' + isbn
          : 'goodreads_' + get(r, 'Book Id'),
        title: get(r, 'Title'),
        author: get(r, 'Author'),
        status: shelf === 'read' ? 'read'
          : shelf === 'to-read' ? 'tbr' : null,
        rating: Number.isInteger(rating) &&
          rating >= 1 && rating <= 5 ? rating : null,
        review: get(r, 'My Review')
      };
    }).filter(r => r.title && (r.status || r.rating));

    const button = document.getElementById('shelfieImportConfirm');
    if (button) button.textContent = 'Import into my Shelfie account';
  };

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function saveWithRetry(table, data, conflict) {
    for (let attempt = 0; attempt < 4; attempt++) {
      const { error } = await cloud.from(table).upsert(data, {
        onConflict: conflict,
        ignoreDuplicates: true
      });

      if (!error) return;

      // Don't retry database permission or schema errors.
      if (!String(error.code || '').startsWith('5') &&
          !/network|fetch|timeout|rate limit/i.test(error.message)) {
        throw error;
      }

      if (attempt === 3) throw error;
      await sleep(1000 * (attempt + 1));
    }
  }

  window.shelfieCommitGoodreads = async function () {
    if (!cloudUser || !cloud) {
      toast('Please sign in first');
      return;
    }

    if (!importRows.length) {
      toast('Choose your Goodreads CSV again');
      return;
    }

    const uid = cloudUser.id;
    const button = document.getElementById('shelfieImportConfirm');
    if (button) button.disabled = true;

    const progress = document.createElement('div');
    progress.style.cssText = 'margin-top:16px;color:#f5a4df';
    button.after(progress);

    let completed = 0;

    try {
      // Smaller batches reduce requests and allow safe re-imports.
      for (let i = 0; i < importRows.length; i += 20) {
        if (cloudUser?.id !== uid) {
          throw new Error('Account changed during import');
        }

        const batch = importRows.slice(i, i + 20);

        const library = batch.filter(r => r.status).map(r => ({
          user_id: uid,
          media_type: 'book',
          title_id: r.id,
          title_name: r.title,
          status: r.status,
          metadata: { author: r.author }
        }));

        const ratings = batch.filter(r => r.rating).map(r => ({
          user_id: uid,
          title_id: r.id,
          title_name: r.title,
          media_type: 'book',
          stars: r.rating,
          review: r.review
        }));

        if (library.length) {
          await saveWithRetry(
            'shelfie_library',
            library,
            'user_id,media_type,title_id'
          );
        }

        if (ratings.length) {
          await saveWithRetry(
            'ratings',
            ratings,
            'user_id,title_id'
          );
        }

        completed += batch.length;
        progress.textContent =
          'Saving to Shelfie: ' + completed +
          ' / ' + importRows.length + ' ♡';

        await sleep(150);
      }

      const total = importRows.length;
      importRows = [];

      modal('Goodreads import complete ♡',
        '<p>Processed ' + total + ' books!</p>' +
        '<p class="muted">Your existing entries were preserved. ' +
        'New records were saved to Supabase.</p>' +
        '<button class="primary full" ' +
        'onclick="closeModal();go(\'Profile\')">' +
        'View my Shelfie ♡</button>'
      );

      if (typeof refreshCloud === 'function') refreshCloud();

    } catch (error) {
      progress.textContent =
        'Import paused after ' + completed +
        ' books. Your saved records are safe. ' +
        'Choose the same CSV and import again to resume.';
      toast(error.message || 'Import paused');
      if (button) button.disabled = false;
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  const fallback =
    'https://placehold.co/180x270/38213f/f8b5e4?text=Shelfie';

  const safe = value => esc(String(value ?? ''));

  const mediaType = value =>
    String(value || '').toLowerCase();

  const isBook = r =>
    mediaType(r.media_type) === 'book' ||
    String(r.title_id || '').startsWith('goodreads_') ||
    String(r.title_id || '').startsWith('openlibrary_') ||
    item(r.title_id)?.type === 'Book';

  function ensureBook(r, libraryRow) {
    const id = String(r.title_id);
    let book = item(id);

    const metadata = libraryRow?.metadata || {};

    if (!book) {
      book = {
        id,
        title: r.title_name || 'Untitled',
        type: 'Book',
        author: metadata.author || '',
        cover: metadata.cover || '',
        fallback,
        genre: 'Book',
        year: '',
        description: ''
      };

      catalog.push(book);
    }

    if (metadata.author && !book.author)
      book.author = metadata.author;

    if (metadata.cover && !book.cover)
      book.cover = metadata.cover;

    if (!book.cover) {
      const isbn = id.startsWith('goodreads_isbn_')
        ? id.replace('goodreads_isbn_', '')
        : '';

      if (isbn)
        book.cover =
          'https://covers.openlibrary.org/b/isbn/' +
          encodeURIComponent(isbn) + '-M.jpg';
      else
        book.cover = fallback;
    }

    book.fallback ||= fallback;

    return book;
  }

  function coverGrid(rows) {
    if (!rows.length)
      return '<div class="empty">No books marked Read yet ♡</div>';

    return `
      <div class="shelfie-read-grid">
        ${rows.map(r => {
          const book = ensureBook(r, r);

          return `
            <button class="shelfie-read-book"
              onclick="openDetail('${safe(book.id)}')">
              <img
                src="${safe(book.cover)}"
                alt="${safe(book.title)}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${fallback}'">
              <span>${safe(book.title)}</span>
            </button>
          `;
        }).join('')}
      </div>
    `;
  }

  async function getMyLibrary() {
    if (!cloudUser) throw Error('Please sign in first');

    const rows = [];
    for (let offset = 0; ; offset += 500) {
      const {data,error} = await cloud
        .from('shelfie_library')
        .select('title_id,title_name,media_type,status,metadata')
        .eq('user_id',cloudUser.id)
        .range(offset,offset + 499);

      if (error) throw error;
      rows.push(...(data || []));
      if (!data || data.length < 500) break;
    }
    return rows;
  }

  async function getMyRatings() {
    if (!cloudUser) throw Error('Please sign in first');

    const rows = [];
    for (let offset = 0; ; offset += 500) {
      const {data,error} = await cloud
        .from('ratings')
        .select('title_id,title_name,media_type,stars,review')
        .eq('user_id',cloudUser.id)
        .order('created_at',{ascending:false})
        .range(offset,offset + 499);

      if (error) throw error;
      rows.push(...(data || []));
      if (!data || data.length < 500) break;
    }
    return rows;
  }

  function ratingList(ratings, library) {
    if (!ratings.length)
      return '<div class="empty">No ratings yet ♡</div>';

    const statuses = new Map(
      library.map(r => [String(r.title_id),r.status])
    );

    const libraryById = new Map(
      library.map(r => [String(r.title_id),r])
    );

    return ratings.map(r => {
      const book = isBook(r);
      const x = book
        ? ensureBook(r,libraryById.get(String(r.title_id)))
        : item(r.title_id) || {
            id:r.title_id,
            title:r.title_name,
            cover:fallback,
            author:'',
            type:r.media_type
          };

      const status = statuses.get(String(r.title_id));
      const stars = Math.max(0,Math.min(5,Number(r.stars)||0));
      const showTBR = false; // Own ratings never display a TBR action

      return `
        <div class="shelfie-rating-row">
          <img class="shelfie-rating-cover"
            src="${safe(x.cover || fallback)}"
            alt="${safe(x.title)}"
            onerror="this.onerror=null;this.src='${fallback}'"
            onclick="openDetail('${safe(x.id)}')">

          <div class="shelfie-rating-info"
            onclick="openDetail('${safe(x.id)}')">
            <div class="shelfie-rating-title">
              ${safe(x.title)}
            </div>
            <div class="shelfie-rating-author">
              ${safe(x.author || '')}
            </div>
            <div class="shelfie-rating-stars">
              ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}
            </div>
          </div>

          ${showTBR ? `
            <button
              class="shelfie-tbr-toggle ${status==='tbr'?'saved':''}"
              data-shelfie-tbr="${safe(x.id)}"
              onclick="shelfieToggleProfileTBR(this)">
              ${status==='tbr'?'✓ TBR':'+ TBR'}
            </button>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  window.shelfieToggleProfileTBR = async function(button) {
    if (!cloudUser) {
      openAccount();
      return;
    }

    const id = button.dataset.shelfieTbr;
    const x = item(id);

    if (!x || x.type !== 'Book') {
      toast('Book not found. Please search for it again.');
      return;
    }

    const uid = cloudUser.id;
    button.disabled = true;

    try {
      const {data:existing,error:readError} = await cloud
        .from('shelfie_library')
        .select('status')
        .eq('user_id',uid)
        .eq('media_type','book')
        .eq('title_id',id)
        .maybeSingle();

      if (readError) throw readError;

      if (existing?.status === 'read') {
        button.remove();
        toast('Already on your Read list ♡');
        return;
      }

      const removing = existing?.status === 'tbr';

      let result;

      if (removing) {
        result = await cloud
          .from('shelfie_library')
          .delete()
          .eq('user_id',uid)
          .eq('media_type','book')
          .eq('title_id',id);
      } else {
        result = await cloud
          .from('shelfie_library')
          .upsert({
            user_id:uid,
            media_type:'book',
            title_id:id,
            title_name:x.title,
            status:'tbr',
            metadata:{
              author:x.author || '',
              cover:x.cover || '',
              fallback:x.fallback || ''
            }
          },{
            onConflict:'user_id,media_type,title_id'
          });
      }

      if (result.error) throw result.error;

      if (cloudUser?.id !== uid) return;

      button.textContent = removing ? '+ TBR' : '✓ TBR';
      button.classList.toggle('saved',!removing);

      toast(removing
        ? 'Removed from your TBR ♡'
        : 'Added to your TBR ♡');

    } catch(error) {
      toast('Could not update TBR: ' + error.message);
    } finally {
      button.disabled = false;
    }
  };

  // Replace only the Ratings and Books Read popup behavior.
  const previousStat = window.shelfieOpenStat;

  window.shelfieOpenStat = async function(kind) {
    if (kind !== 'ratings' && kind !== 'books')
      return previousStat(kind);

    if (!cloudUser) {
      openAccount();
      return;
    }

    modal(kind === 'ratings'
      ? 'My Ratings ♡'
      : 'Books Read ♡',
      '<div class="empty">Loading from Shelfie ♡</div>');

    const uid = cloudUser.id;

    try {
      const library = await getMyLibrary();

      if (cloudUser?.id !== uid) return;

      if (kind === 'books') {
        const read = library.filter(r =>
          r.media_type === 'book' && r.status === 'read'
        );

        modal('Books Read ♡',coverGrid(read));
      } else {
        const ratings = await getMyRatings();

        if (cloudUser?.id !== uid) return;

        modal('My Ratings ♡', `
          <input class="searchbox" id="shelfieRatingsSearch"
            type="search" autocomplete="off"
            aria-label="Search my ratings"
            placeholder="⌕ Search titles or authors..."
            style="margin:0 0 15px"
            oninput="shelfieFilterRatings(this.value)">
          <div id="shelfieRatingsResults">
            ${ratingList(ratings,library)}
          </div>
          <p id="shelfieRatingsNoResults" class="empty" hidden>
            No matching ratings found ♡
          </p>
        `);
      }
    } catch(error) {
      modal('Shelfie ♡',
        '<p class="muted">Could not load your library.</p>');
      toast(error.message);
    }
  };

  // Friend-profile TBR buttons must update the VIEWER's account.
  window.shelfieFriendTBR = async function(id) {
    if (!cloudUser) {
      openAccount();
      return;
    }

    const button = [...document.querySelectorAll(
      '.modal button,.shelfie-friend-list button'
    )].find(b =>
      b.getAttribute('onclick')?.includes(
        "shelfieFriendTBR('" + id + "')"
      )
    );

    const x = item(id);
    if (!x || x.type !== 'Book') return;

    const temporary = button || document.createElement('button');
    temporary.dataset.shelfieTbr = id;

    await window.shelfieToggleProfileTBR(temporary);

    if (button) {
      button.textContent = temporary.textContent;
      button.classList.toggle('saved',
        temporary.classList.contains('saved'));
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  let savedRows = [];
  let currentFilter = 'All';
  let currentSearch = '';
  let loadVersion = 0;

  const fallback =
    'https://placehold.co/240x360/38213f/f8b5e4?text=Shelfie';

  function category(row) {
    const type = String(row.media_type || '').toLowerCase();

    if (type === 'book') return 'Books';
    if (type === 'movie') return 'Movies';
    if (type === 'show' || type === 'tv' ||
        type === 'tv show') return 'Shows';

    return 'Other';
  }

  function validSaved(row) {
    return ['tbr','watchlist'].includes(
      String(row.status || '').toLowerCase()
    );
  }

  function ensureCatalogItem(row) {
    let x = item(row.title_id);
    const meta = row.metadata || {};

    if (!x) {
      x = {
        id: row.title_id,
        title: row.title_name || 'Untitled',
        type: category(row) === 'Books'
          ? 'Book'
          : category(row) === 'Movies'
            ? 'Movie'
            : 'Show',
        author: meta.author || '',
        cover: meta.cover || '',
        fallback,
        year: meta.year || '',
        genre: meta.genre || '',
        description: meta.description || '',
        workKey: meta.workKey || ''
      };

      catalog.push(x);
    }

    if (!x.cover && meta.cover) x.cover = meta.cover;

    if (!x.cover &&
        String(row.title_id).startsWith('goodreads_isbn_')) {
      const isbn = row.title_id.replace('goodreads_isbn_','');
      x.cover = 'https://covers.openlibrary.org/b/isbn/' +
        encodeURIComponent(isbn) + '-M.jpg';
    }

    x.cover ||= fallback;
    x.fallback ||= fallback;

    return x;
  }

  function profileShortcut() {
    return `
      <button class="shelfie-list-link"
        onclick="shelfieOpenSavedPage()">
        <span class="shelfie-list-heart">♡</span>
        <span class="shelfie-list-label">
          My TBR & Watchlist
        </span>
        <span class="shelfie-list-number">
          ${state.saved?.length || 0}
        </span>
        <span class="shelfie-list-arrow">›</span>
      </button>
    `;
  }

  // Replace only the oversized TBR section.
  const oldProfilePage = profilePage;

  profilePage = function () {
    const html = oldProfilePage();

    return html.replace(
      /<section class="shelfie-profile-section">\s*<h2>♡ My TBR & Watchlist<\/h2>[\s\S]*?<\/section>/,
      profileShortcut()
    );
  };

  function savedPage() {
    return `
      <section class="shelfie-list-page">
        <div class="shelfie-list-heading">
          <button class="shelfie-list-back"
            onclick="go('Profile')"
            aria-label="Back to profile">‹</button>
          <h1>♡ My TBR & Watchlist</h1>
        </div>

        <input
          id="shelfieSavedSearch"
          class="shelfie-list-search"
          type="search"
          placeholder="⌕ Search your saved titles..."
          value="${esc(currentSearch)}"
          oninput="shelfieSearchSaved(this.value)">

        <div id="shelfieSavedFilters"
          class="shelfie-list-filters"></div>

        <div id="shelfieSavedCount"
          class="shelfie-list-count"></div>

        <div id="shelfieSavedGrid"
          class="shelfie-list-grid">
          <div class="shelfie-list-empty">
            Loading your Shelfie ♡
          </div>
        </div>
      </section>
    `;
  }

  const oldRender = render;

  render = function () {
    if (tab === 'SavedLibrary') {
      nav();
      document.getElementById('screen').innerHTML = savedPage();
      drawSavedResults();
      return;
    }

    oldRender();
  };

  function drawSavedResults() {
    if (tab !== 'SavedLibrary') return;

    const filters = document.getElementById(
      'shelfieSavedFilters'
    );
    const count = document.getElementById(
      'shelfieSavedCount'
    );
    const grid = document.getElementById(
      'shelfieSavedGrid'
    );

    if (!filters || !count || !grid) return;

    filters.innerHTML =
      ['All','Books','Movies','Shows'].map(f => `
        <button
          class="shelfie-list-filter
            ${currentFilter === f ? 'active' : ''}"
          onclick="shelfieFilterSaved('${f}')">
          ${f}
        </button>
      `).join('');

    const filtered = savedRows.filter(row =>
      currentFilter === 'All' ||
      category(row) === currentFilter
    );

    const q = currentSearch.trim().toLowerCase();

    const matching = filtered.filter(row =>
      String(row.title_name || '')
        .toLowerCase()
        .includes(q)
    );

    const description =
      currentFilter === 'All' ? 'titles saved' :
      currentFilter === 'Books' ? 'books saved' :
      currentFilter === 'Movies' ? 'movies saved' :
      'shows saved';

    count.innerHTML = `
      <strong>${filtered.length}</strong>
      <span>${description}
        ${q ? ' · ' + matching.length + ' matching' : ''}
      </span>
    `;

    grid.innerHTML = matching.map(row => {
      const x = ensureCatalogItem(row);

      return `
        <button class="shelfie-list-cover"
          data-shelfie-id="${esc(x.id)}"
          aria-label="Open ${esc(x.title)}">
          <img
            src="${esc(x.cover)}"
            alt="${esc(x.title)} cover"
            loading="lazy"
            onerror="this.onerror=null;this.src='${fallback}'">
          <span>${esc(x.title)}</span>
        </button>
      `;
    }).join('') || `
      <div class="shelfie-list-empty">
        No matching saved titles ♡
      </div>
    `;

    // Open the existing Shelfie detail screen.
    grid.querySelectorAll('[data-shelfie-id]')
      .forEach(button => {
        button.addEventListener('click',() => {
          openDetail(button.dataset.shelfieId);
        });
      });
  }

  window.shelfieSearchSaved = function (value) {
    currentSearch = value;
    drawSavedResults();
  };

  window.shelfieFilterSaved = function (value) {
    currentFilter = value;
    drawSavedResults();
  };

  window.shelfieOpenSavedPage = async function () {
    if (!cloudUser || !cloud) {
      openAccount();
      return;
    }

    const userId = cloudUser.id;
    const version = ++loadVersion;

    currentFilter = 'All';
    currentSearch = '';
    savedRows = [];

    tab = 'SavedLibrary';
    render();
    window.scrollTo(0,0);

    try {
      const all = [];

      // Fetch every page, not just the first 1,000 titles.
      for (let offset = 0; ; offset += 500) {
        const {data,error} = await cloud
          .from('shelfie_library')
          .select(
            'title_id,title_name,media_type,status,metadata'
          )
          .eq('user_id',userId)
          .in('status',['tbr','watchlist'])
          .order('title_name',{ascending:true})
          .range(offset,offset + 499);

        if (error) throw error;

        all.push(...(data || []));

        if (!data || data.length < 500) break;
      }

      if (version !== loadVersion ||
          cloudUser?.id !== userId) return;

      savedRows = all.filter(validSaved);

      // Remove accidental duplicates.
      const unique = new Map();

      savedRows.forEach(row => {
        unique.set(
          category(row) + ':' + row.title_id,
          row
        );
      });

      savedRows = [...unique.values()];

      savedRows.forEach(ensureCatalogItem);

      drawSavedResults();

    } catch (error) {
      if (version !== loadVersion) return;

      const grid = document.getElementById(
        'shelfieSavedGrid'
      );

      if (grid) {
        grid.innerHTML = `
          <div class="shelfie-list-empty">
            Couldn't load your saved titles.
            Please try again ♡
          </div>
        `;
      }

      toast(error.message || 'Could not load watchlist');
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  let finishedKind = 'books';
  let finishedRows = [];
  let finishedGenre = 'All';
  let finishedSearch = '';
  let finishedVersion = 0;

  const fallbackCover =
    'https://placehold.co/240x360/38213f/f8b5e4?text=Shelfie';

  const settings = {
    books: {
      title: 'Books Read',
      media: 'book',
      status: 'read'
    },
    movies: {
      title: 'Movies Watched',
      media: 'movie',
      status: 'watched'
    },
    shows: {
      title: 'Shows Watched',
      media: 'show',
      status: 'watched'
    }
  };

  function normalizeGenre(value) {
    if (Array.isArray(value)) {
      return value.flatMap(normalizeGenre);
    }

    if (!value) return [];

    return String(value)
      .split(/[,;|]/)
      .map(x => x.trim())
      .filter(Boolean);
  }

  function genresFor(row) {
    const meta = row.metadata || {};
    const existing = item(row.title_id);

    return [
      ...normalizeGenre(meta.genres),
      ...normalizeGenre(meta.genre),
      ...normalizeGenre(existing?.genre)
    ].filter(x =>
      x.toLowerCase() !== 'book' &&
      x.toLowerCase() !== 'movie' &&
      x.toLowerCase() !== 'show'
    );
  }

  function ensureFinishedItem(row) {
    const meta = row.metadata || {};
    let x = item(row.title_id);

    if (!x) {
      x = {
        id: row.title_id,
        title: row.title_name || 'Untitled',
        type: finishedKind === 'books'
          ? 'Book'
          : finishedKind === 'movies'
            ? 'Movie'
            : 'Show',
        author: meta.author || '',
        year: meta.year || '',
        genre: meta.genre || '',
        cover: meta.cover || '',
        description: meta.description || '',
        workKey: meta.workKey || '',
        fallback: fallbackCover
      };

      catalog.push(x);
    }

    if (!x.cover && meta.cover) {
      x.cover = meta.cover;
    }

    if (!x.cover &&
        String(row.title_id).startsWith('goodreads_isbn_')) {
      const isbn = row.title_id.replace(
        'goodreads_isbn_', ''
      );

      x.cover =
        'https://covers.openlibrary.org/b/isbn/' +
        encodeURIComponent(isbn) + '-M.jpg';
    }

    x.cover ||= fallbackCover;
    x.fallback ||= fallbackCover;

    return x;
  }

  function finishedPage() {
    const title = settings[finishedKind].title;

    return `
      <section class="shelfie-finished-page">

        <div class="shelfie-finished-heading">
          <button
            class="shelfie-finished-back"
            onclick="go('Profile')"
            aria-label="Back to profile">‹</button>

          <h1>${esc(title)} ♡</h1>
        </div>

        <input
          class="shelfie-finished-search"
          type="search"
          placeholder="⌕ Search your collection..."
          value="${esc(finishedSearch)}"
          oninput="shelfieSearchFinished(this.value)">

        <div
          id="shelfieFinishedGenres"
          class="shelfie-finished-genres">
        </div>

        <div
          id="shelfieFinishedCount"
          class="shelfie-finished-count">
        </div>

        <div
          id="shelfieFinishedGrid"
          class="shelfie-finished-grid">
          <div class="shelfie-finished-empty">
            Loading your Shelfie ♡
          </div>
        </div>

      </section>
    `;
  }

  function drawFinished() {
    if (tab !== 'FinishedLibrary') return;

    const genresEl = document.getElementById(
      'shelfieFinishedGenres'
    );

    const countEl = document.getElementById(
      'shelfieFinishedCount'
    );

    const gridEl = document.getElementById(
      'shelfieFinishedGrid'
    );

    if (!genresEl || !countEl || !gridEl) return;

    const genreMap = new Map();

    finishedRows.forEach(row => {
      genresFor(row).forEach(genre => {
        const key = genre.toLowerCase();

        if (!genreMap.has(key)) {
          genreMap.set(key, genre);
        }
      });
    });

    const genres = [
      'All',
      ...[...genreMap.values()].sort(
        (a, b) => a.localeCompare(b)
      )
    ];

    genresEl.innerHTML = genres.map((genre, i) => `
      <button
        class="shelfie-finished-genre
          ${finishedGenre === genre ? 'active' : ''}"
        data-genre-index="${i}">
        ${esc(genre)}
      </button>
    `).join('');

    genresEl.querySelectorAll('[data-genre-index]')
      .forEach(button => {
        button.addEventListener('click', () => {
          const index = Number(
            button.dataset.genreIndex
          );

          finishedGenre = genres[index];
          drawFinished();
        });
      });

    const q = finishedSearch.trim().toLowerCase();

    const matches = finishedRows.filter(row => {
      const x = ensureFinishedItem(row);

      const genreMatches =
        finishedGenre === 'All' ||
        genresFor(row).some(g =>
          g.toLowerCase() ===
          finishedGenre.toLowerCase()
        );

      const text = [
        x.title,
        x.author,
        x.year
      ].join(' ').toLowerCase();

      return genreMatches && text.includes(q);
    });

    countEl.textContent =
      matches.length + ' of ' +
      finishedRows.length + ' titles';

    gridEl.innerHTML = matches.map(row => {
      const x = ensureFinishedItem(row);

      return `
        <button
          class="shelfie-finished-cover"
          data-finished-id="${esc(x.id)}"
          aria-label="Open ${esc(x.title)}">

          <img
            src="${esc(x.cover)}"
            alt="${esc(x.title)} cover"
            loading="lazy"
            onerror="this.onerror=null;this.src='${fallbackCover}'">

          <span>${esc(x.title)}</span>
        </button>
      `;
    }).join('') || `
      <div class="shelfie-finished-empty">
        No matching titles found ♡
      </div>
    `;

    gridEl.querySelectorAll('[data-finished-id]')
      .forEach(button => {
        button.addEventListener('click', () => {
          openDetail(button.dataset.finishedId);
        });
      });
  }

  window.shelfieSearchFinished = function(value) {
    finishedSearch = value;
    drawFinished();
  };

  const previousRender = render;

  render = function() {
    if (tab === 'FinishedLibrary') {
      nav();

      document.getElementById('screen').innerHTML =
        finishedPage();

      drawFinished();
      return;
    }

    previousRender();
  };

  const previousOpenStat = window.shelfieOpenStat;

  window.shelfieOpenStat = function(kind) {
    if (!['books','movies','shows'].includes(kind)) {
      return previousOpenStat(kind);
    }

    return window.shelfieOpenFinishedPage(kind);
  };

  window.shelfieOpenFinishedPage =
    async function(kind) {

    if (!cloudUser || !cloud) {
      openAccount();
      return;
    }

    const config = settings[kind];
    if (!config) return;

    const userId = cloudUser.id;
    const version = ++finishedVersion;

    finishedKind = kind;
    finishedGenre = 'All';
    finishedSearch = '';
    finishedRows = [];

    tab = 'FinishedLibrary';
    render();
    window.scrollTo(0, 0);

    try {
      const all = [];

      for (let offset = 0; ; offset += 500) {
        const {data,error} = await cloud
          .from('shelfie_library')
          .select(
            'title_id,title_name,media_type,status,metadata'
          )
          .eq('user_id', userId)
          .eq('media_type', config.media)
          .eq('status', config.status)
          .order('title_name', {ascending:true})
          .range(offset, offset + 499);

        if (error) throw error;

        all.push(...(data || []));

        if (!data || data.length < 500) break;
      }

      if (version !== finishedVersion ||
          cloudUser?.id !== userId ||
          tab !== 'FinishedLibrary') return;

      const unique = new Map();

      all.forEach(row => {
        unique.set(row.title_id, row);
      });

      finishedRows = [...unique.values()];

      finishedRows.forEach(ensureFinishedItem);

      drawFinished();

    } catch(error) {
      if (version !== finishedVersion ||
          tab !== 'FinishedLibrary') return;

      const grid = document.getElementById(
        'shelfieFinishedGrid'
      );

      if (grid) {
        grid.innerHTML = `
          <div class="shelfie-finished-empty">
            Couldn't load your collection.
            Please try again ♡
          </div>
        `;
      }

      toast(error.message || 'Could not load collection');
    }
  };
})();
</script>

 for(const x of [n,l,c,r])if(x.error)throw x.error;
 if(cloudUser?.id!==uid)return;

 return `<article class="shelfie-notice shelfie-activity-rating"><button class="shelfie-rating-open" onclick="shelfieOpenRating('${esc(id)}')"><b>${esc(x.title_name)}</b><div class="stars" style="margin:7px 0">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>${x.review?`<p>${esc(x.review)}</p>`:''}<span class="subtle">${esc(date(x.at))}</span></button><div class="shelfie-activity-actions"><button onclick="shelfieWhoLiked('${esc(id)}')" aria-label="See who liked this review">♡ ${lc||''}</button><button onclick="shelfieOpenRating('${esc(id)}')" aria-label="Read comments">💬 ${cc||''}</button></div></article>`;
 };
 const note=x=>`<div class="shelfie-notice ${x.read_at?'':'unread'}"><button onclick="shelfieOpenNotification('${esc(String(x.id))}')">${x.kind==='like'?'♥':x.kind==='reply'?'↪':'💬'} Someone ${esc(({like:'liked your review',comment:'commented on your review',reply:'replied to your comment'})[x.kind]||'interacted with you')}</button><div class="subtle">${esc(date(x.created_at))}</div></div>`;
 const prevProfile=profilePage;profilePage=function(){return prevProfile()+(cloudUser?`<div class="sectionhead"><h2>♡ My activity</h2><button class="linkbtn" onclick="shelfieShowActivity()">See all →</button></div>${activities.slice(0,3).map(entry).join('')||'<p class="muted">Your activity will appear here ♡</p>'}`:'')};
 const prevRender=render;render=function(){if(tab==='ShelfieActivity'||tab==='ShelfieNotifications'){nav();document.getElementById('screen').innerHTML=tab==='ShelfieActivity'?`<div class="hero"><button class="linkbtn" onclick="go('Profile')">‹ Profile</button><h1>♡ My activity</h1></div>${activities.map(entry).join('')||'<p class="empty">No activity yet ♡</p>'}`:`<div class="hero"><button class="linkbtn" onclick="go('Home')">‹ Home</button><h1>🔔 Notifications</h1></div><button class="linkbtn" onclick="shelfieReadAll()">Mark all read</button>${notices.map(note).join('')||'<p class="empty">No notifications yet ♡</p>'}`;bell();return}prevRender();bell()};
 window.shelfieShowActivity=async()=>{tab='ShelfieActivity';sessionStorage.setItem('shelfie-current-page',tab);render();await reload(true);render();scrollTo(0,0)};
 window.shelfieNotifications=async()=>{if(!cloudUser){openAccount();return}tab='ShelfieNotifications';sessionStorage.setItem('shelfie-current-page',tab);render();await reload(true);render();scrollTo(0,0)};
 window.shelfieReadAll=async()=>{if(!cloudUser)return;const {error}=await cloud.from('shelfie_notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',cloudUser.id).is('read_at',null);if(error){toast(error.message);return}last=0;await reload(true);render()};
 window.shelfieOpenNotification=async id=>{const n=notices.find(x=>String(x.id)===String(id));if(!n)return;if(!n.read_at){await cloud.from('shelfie_notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('recipient_id',cloudUser.id);n.read_at=new Date().toISOString();bell()}if(n.rating_id)shelfieOpenRating(n.rating_id)};
 window.shelfieWhoLiked=async id=>{
 if(!cloudUser)return;
 const q=await cloud.from('shelfie_rating_likes').select('user_id,created_at').eq('rating_id',id).order('created_at',{ascending:false});
 if(q.error){toast(q.error.message);return}
 const likes=q.data||[];
 if(!likes.length){modal('♡ Likes','<p class="muted">No likes yet ♡</p>');return}
 const uids=[...new Set(likes.map(x=>x.user_id))];
 const p=await cloud.from('profiles').select('id,display_name,username').in('id',uids);
 if(p.error){toast(p.error.message);return}
 const profiles=new Map((p.data||[]).map(x=>[x.id,x]));
 modal(`♡ Liked by ${likes.length}`,likes.map(x=>{const person=profiles.get(x.user_id);return `<div class="shelfie-like-person"><span class="avatar">${esc((person?.display_name||person?.username||'S')[0].toUpperCase())}</span><div><b>${esc(person?.display_name||person?.username||'Shelfie member')}</b><div class="subtle">${person?.username?'@'+esc(person.username)+' · ':''}${esc(date(x.created_at))}</div></div></div>`}).join(''));
 };
 window.shelfieOpenRating=async id=>{if(!cloudUser)return;const [a,b]=await Promise.all([cloud.from('ratings').select('id,title_name,stars,review,created_at,profiles(display_name,username)').eq('id',id).maybeSingle(),cloud.from('shelfie_rating_comments').select('id,user_id,body,parent_comment_id,created_at,profiles(display_name,username)').eq('rating_id',id).order('created_at',{ascending:true})]);if(a.error||b.error||!a.data){toast(a.error?.message||b.error?.message||'Review unavailable');return}const cs=b.data||[];
 const node=(c,depth=0)=>`<div class="shelfie-social-comment ${depth?'shelfie-thread-reply':''}"><b>${esc(c.profiles?.display_name||c.profiles?.username||'Shelfie member')}</b><p>${esc(c.body)}</p><div class="subtle">${esc(date(c.created_at))}</div><button class="linkbtn" onclick="shelfieReply('${esc(String(c.id))}')">↪ Reply</button>${depth<4?cs.filter(x=>String(x.parent_comment_id)===String(c.id)).map(x=>node(x,depth+1)).join(''):''}</div>`;
 modal('Comments ♡',`<p class="muted">${esc(a.data.title_name)} · ${esc(a.data.profiles?.display_name||'Shelfie member')}</p><div class="stars">${'★'.repeat(Math.max(0,Math.min(5,Number(a.data.stars)||0)))}</div>${a.data.review?`<p style="white-space:pre-wrap">${esc(a.data.review)}</p>`:''}<div class="subtle">${esc(date(a.data.created_at))}</div><hr class="divider"><h3>Comments</h3>${cs.filter(x=>!x.parent_comment_id||!cs.some(y=>String(y.id)===String(x.parent_comment_id))).map(x=>node(x)).join('')||'<p class="muted">Be the first to comment ♡</p>'}<form onsubmit="shelfieSendReply(event,'${esc(String(id))}')"><div id="shelfieReplyLabel" class="subtle"></div><input type="hidden" id="shelfieReplyParent"><textarea id="shelfieReplyText" required maxlength="1000" placeholder="Write a comment... ♡"></textarea><button class="primary full" type="submit">Post ♡</button></form>`)};
 window.shelfieReply=id=>{document.getElementById('shelfieReplyParent').value=id;document.getElementById('shelfieReplyLabel').textContent='↪ Replying to a comment';document.getElementById('shelfieReplyText').focus()};

 window.shelfieSocialComments=id=>shelfieOpenRating(id);

 window.addEventListener('focus',()=>{if(cloudUser)reload(true)});setInterval(()=>{if(cloudUser)reload(true)},45000);setTimeout(()=>{bell();if(cloudUser)reload(true)},1500);
})();

<script>
/* Public discovery is separate from the follow-only Circle feed. */
(function(){
 let community=[],busy=false,loaded=0,owner=null,sort='newest',likeCounts=new Map(),commentCounts=new Map();
 const coverFallback='https://placehold.co/240x360/38213f/f8b5e4?text=Shelfie';
 const date=d=>{const t=new Date(d);return isNaN(t.getTime())?'':t.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
 function poster(r){const x=item(r.title_id);if(x?.cover)return x.cover;if(String(r.title_id).startsWith('goodreads_isbn_'))return 'https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(String(r.title_id).slice(15))+'-M.jpg';return coverFallback}
 function count(map,id){return map.get(String(id))||0}
 function ordered(){return [...community].sort((a,b)=>{let n=sort==='liked'?count(likeCounts,b.id)-count(likeCounts,a.id):sort==='commented'?count(commentCounts,b.id)-count(commentCounts,a.id):0;return n||new Date(b.created_at)-new Date(a.created_at)})}
 function filter(){return `<div class="shelfie-community-sort"><label for="shelfieCommunitySort">Sort reviews</label><select id="shelfieCommunitySort" onchange="shelfieSortCommunity(this.value)"><option value="newest" ${sort==='newest'?'selected':''}>Newest</option><option value="liked" ${sort==='liked'?'selected':''}>Most liked ♡</option><option value="commented" ${sort==='commented'?'selected':''}>Most commented 💬</option></select></div>`}
 function card(r){const id=String(r.id),name=r.profiles?.display_name||r.profiles?.username||'Shelfie member';const stars=Math.max(0,Math.min(5,Number(r.stars)||0));return `<article class="shelfie-social-card"><div class="shelfie-social-user"><div class="avatar">${esc(name.charAt(0).toUpperCase())}</div><div><b>${esc(name)}</b><div class="subtle">${esc(date(r.created_at))} · ${esc(r.media_type||'Rating')}</div></div></div><div class="shelfie-social-body shelfie-discover-click" role="button" tabindex="0" onclick="shelfieCommunityOpen('${esc(id)}')" onkeydown="if(event.key==='Enter')shelfieCommunityOpen('${esc(id)}')"><img src="${esc(poster(r))}" alt="${esc(r.title_name)} cover" loading="lazy" onerror="this.onerror=null;this.src='${coverFallback}'"><div><h3>${esc(r.title_name)}</h3><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>${r.review?`<p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.review)}</p>`:''}</div></div><div class="shelfie-social-actions"><button onclick="shelfieCommunityOpen('${esc(id)}')">♡ ${count(likeCounts,id)||''} Like / view likes</button><button onclick="shelfieCommunityOpen('${esc(id)}')">💬 ${count(commentCounts,id)||''} Comments</button></div></article>`}
 function section(limit){if(!cloudUser)return '<div class="shelfie-social-empty">Sign in to discover Shelfie reviews ♡</div>';if(busy&&!community.length)return '<div class="shelfie-social-empty">Discovering Shelfie reviews ♡</div>';return ordered().slice(0,limit||community.length).map(card).join('')||'<div class="shelfie-social-empty">No community reviews to discover yet ♡</div>'}
 function paint(){const home=document.getElementById('shelfieCommunity');if(home)home.innerHTML=section(5);const full=document.getElementById('shelfieCommunityFull');if(full)full.innerHTML=section()}
 async function load(force=false){if(!cloud||!cloudUser){community=[];paint();return}if(busy||(!force&&owner===cloudUser.id&&Date.now()-loaded<45000))return;busy=true;try{const {data,error}=await cloud.from('ratings').select('id,user_id,title_id,title_name,media_type,stars,review,created_at,profiles(username,display_name)').order('created_at',{ascending:false}).limit(250);if(error)throw error;const uid=cloudUser.id;community=(data||[]).filter(r=>r.user_id!==uid);
     const ids=community.map(r=>r.id);
     likeCounts=new Map();commentCounts=new Map();
     if(ids.length){
       const [likes,comments]=await Promise.all([
         cloud.from('shelfie_rating_likes').select('rating_id').in('rating_id',ids),
         cloud.from('shelfie_rating_comments').select('rating_id').in('rating_id',ids)
       ]);
       if(likes.error)console.warn('Community likes count:',likes.error);
       else for(const x of likes.data||[])likeCounts.set(String(x.rating_id),count(likeCounts,x.rating_id)+1);
       if(comments.error)console.warn('Community comments count:',comments.error);
       else for(const x of comments.data||[])commentCounts.set(String(x.rating_id),count(commentCounts,x.rating_id)+1);
     }
     owner=uid;loaded=Date.now();}catch(e){console.warn('Shelfie discovery:',e);toast('Community reviews unavailable: '+e.message)}finally{busy=false;paint()}}
 const oldHome=home;
 home=function(){let html=oldHome();const heading='<div class="shelfie-social-head"><h2>🌎 Community reviews</h2><button class="linkbtn" onclick="shelfieCommunityAll()">See all →</button></div><p class="shelfie-discover-note">Discover reviews and new people across Shelfie ♡</p><div id="shelfieCommunity">'+section(5)+'</div>';const start=html.indexOf('<div class="shelfie-social-head"><h2>♡ Community reviews</h2>');if(start>=0)return html.slice(0,start)+heading;const old=html.indexOf('<div class="sectionhead"><h2>🌎 Community reviews</h2>');return old>=0?html.slice(0,old)+heading:html+heading};
 const oldRender=render;
 render=function(){if(tab==='ShelfieCommunity'){nav();document.getElementById('screen').innerHTML=`<div class="hero"><button class="shelfie-social-back" onclick="go('Home')">‹ Back</button><h1>🌎 Community reviews</h1><p class="muted">Discover ratings and reviews from people across Shelfie.</p></div>${filter()}<div id="shelfieCommunityFull">${section()}</div>`;if(cloudUser)load();return}oldRender();if(tab==='Home'&&cloudUser)load()};
 window.shelfieSortCommunity=function(value){if(!['newest','liked','commented'].includes(value))return;sort=value;paint()};
 window.shelfieCommunityAll=function(){tab='ShelfieCommunity';sessionStorage.setItem('shelfie-current-page',tab);render();window.scrollTo(0,0);load(true)};
 window.shelfieCommunityOpen=function(id){if(typeof window.shelfieOpenRating==='function')window.shelfieOpenRating(id);else if(typeof window.shelfieOpenSocialRating==='function')window.shelfieOpenSocialRating(id);else toast('Review details are unavailable')};
 const oldRefresh=refreshCloud;refreshCloud=async function(){await oldRefresh();loaded=0;if(tab==='Home'||tab==='ShelfieCommunity')await load(true)};
 window.addEventListener('focus',()=>{if((tab==='Home'||tab==='ShelfieCommunity')&&Date.now()-loaded>45000)load()});
 setTimeout(()=>{if(cloudUser)load()},1200);
})();
</script>

<script>
(function(){
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let cache=[],owner=null,fetching=false,last=0;
 function markup(){return `<section class="shelfie-home-groups" id="shelfieHomeGroups"><div class="shg-top"><h2>✧ Your Groups</h2><button type="button" class="shg-link" onclick="go('Groups')">See all →</button></div><div class="shg-cards" id="shelfieHomeGroupCards">${cards()}</div><button type="button" class="shg-discover" onclick="shelfieDiscoverGroups()">＋ Discover groups ♡</button></section>`}
 function cards(){if(!cloudUser)return '<div class="shg-empty">Sign in to see your groups ♡</div>';if(!cache.length)return '<div class="shg-empty">Your next favorite discussion is waiting ♡</div>';return cache.slice(0,3).map(g=>`<button type="button" class="shg-card" onclick="shelfieOpenSharedGroup('${safe(g.id)}')"><span class="shg-icon">♧</span><span class="shg-info"><span class="shg-name">${safe(g.name)}</span><span class="shg-meta">${safe(g.visibility||'Your Shelfie group')} · ${g.creator_id===owner?'Created by you':'Member'}</span></span><span class="shg-chevron">›</span></button>`).join('')}
 function paint(){const el=document.getElementById('shelfieHomeGroupCards');if(el)el.innerHTML=cards()}
 async function fetchGroups(){if(!cloud||!cloudUser||fetching)return;const uid=cloudUser.id;if(owner===uid&&Date.now()-last<60000)return;fetching=true;try{const [a,b]=await Promise.all([cloud.from('shelfie_group_members').select('group_id').eq('user_id',uid),cloud.from('shelfie_groups').select('id,name,creator_id,visibility').eq('creator_id',uid)]);if(a.error||b.error)throw a.error||b.error;const ids=[...new Set([...(a.data||[]).map(x=>x.group_id),...(b.data||[]).map(x=>x.id)])];let data=b.data||[];if(ids.length){const r=await cloud.from('shelfie_groups').select('id,name,creator_id,visibility').in('id',ids);if(r.error)throw r.error;data=r.data||[]}if(cloudUser?.id!==uid)return;cache=data;owner=uid;last=Date.now();paint()}catch(e){console.warn('Shelfie home groups:',e)}finally{fetching=false}}
 function install(){if(typeof tab==='undefined'||tab!=='Home')return;const screen=document.getElementById('screen');if(!screen||screen.querySelector('#shelfieHomeGroups'))return;const heading=[...screen.querySelectorAll('.sectionhead h2')].find(e=>/Your groups/i.test(e.textContent));if(!heading)return;const head=heading.closest('.sectionhead');if(!head)return;let stop=head.nextElementSibling;while(stop&&(stop.classList.contains('groupcard')||stop.id==='shelfie-discover-btn')){const next=stop.nextElementSibling;stop.remove();stop=next}head.insertAdjacentHTML('beforebegin',markup());head.remove();const discover=screen.querySelector('#shelfie-discover-btn');if(discover)discover.remove();if(owner!==cloudUser?.id){cache=[];owner=null;paint()}fetchGroups()}
 const observer=new MutationObserver(()=>install());const screen=document.getElementById('screen');if(screen)observer.observe(screen,{childList:true});setTimeout(install,0);window.addEventListener('focus',()=>{last=0;fetchGroups()});
