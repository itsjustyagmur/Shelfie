<!-- SHELFIE: TMDB Movies & Shows via secure Supabase Edge Function -->
<style>
.shelfie-tmdb-status{padding:18px 8px;color:#d8b0d1;text-align:center}
.shelfie-tmdb-source{font-size:12px;color:#d7a2cb;margin:10px 4px;text-align:right}
</style>
<script>
(function(){
  let timer, sequence=0;
  const fallback='https://placehold.co/300x450/38213f/f8b5e4?text=Shelfie';
  function category(){return filter==='Movies'?'movie':filter==='Shows'?'tv':null}
  function normalized(x){return {
    id:'tmdb_'+x.media_type+'_'+x.id, title:x.title, type:x.media_type==='movie'?'Movie':'Show',
    year:x.year||'', genre:(x.genres||[]).join(', ')|| (x.media_type==='movie'?'Movie':'TV Show'),
    description:x.description||'', cover:x.poster||fallback, fallback,
    tmdbId:x.id, tmdbType:x.media_type, tmdbRating:x.rating, tmdbBackdrop:x.backdrop||''
  }}
  async function request(params){
    if(typeof SHELFIE_URL==='undefined'||typeof SHELFIE_KEY==='undefined') throw new Error('Supabase is not configured');
    const url=SHELFIE_URL+'/functions/v1/tmdb-search?'+new URLSearchParams(params);
    const response=await fetch(url,{headers:{apikey:SHELFIE_KEY,Authorization:'Bearer '+SHELFIE_KEY}});
    let data;try{data=await response.json()}catch(_){data={}};
    if(!response.ok)throw new Error(data.error||('TMDB service unavailable ('+response.status+')'));
    return data;
  }
  function upsert(x){let obj=normalized(x),existing=item(obj.id);if(existing)Object.assign(existing,obj);else catalog.push(obj);return existing||obj}
  const previousUpdate=updateResults;
  updateResults=function(){
    clearTimeout(timer);const current=++sequence;
    const type=category(),query=search.trim();
    if(!type||query.length<2){previousUpdate();return}
    const chips=document.querySelector('.chips');
    if(chips)chips.innerHTML=['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';updateResults()">${f}</button>`).join('');
    const results=document.getElementById('results');if(!results)return;
    results.innerHTML='<div class="shelfie-tmdb-status">Searching '+(type==='movie'?'movies':'shows')+' ♡</div>';
    timer=setTimeout(async()=>{
      try{
        const data=await request({type,q:query});
        if(current!==sequence||tab!=='Search'||category()!==type||search.trim()!==query)return;
        const items=(data.results||[]).map(upsert);
        results.innerHTML=items.map(coverCard).join('')||'<div class="shelfie-tmdb-status">No titles found ♡</div>';
        document.querySelectorAll('#shelfieTmdbCredit').forEach(e=>e.remove());
        results.insertAdjacentHTML('afterend','<div class="shelfie-tmdb-source" id="shelfieTmdbCredit">Movie & TV information provided by TMDB. Not endorsed or certified by TMDB.</div>');
        document.querySelectorAll('#shelfieTmdbCredit').forEach((e,i)=>{if(i>0)e.remove()});
      }catch(err){if(current===sequence){results.innerHTML='<div class="shelfie-tmdb-status">'+esc(err.message||'Search unavailable')+'. Try again later ♡</div>';}}
    },350);
  };
  const previousSearch=searchPage;
  searchPage=function(){const html=previousSearch();setTimeout(()=>{if(tab==='Search'&&category()&&search.trim().length>=2)updateResults()},0);return html};
  const previousDetail=openDetail;
  openDetail=function(id){
    const x=item(id);if(!x||!x.tmdbId)return previousDetail(id);
    previousDetail(id);
    if(x.description){const modalEl=document.querySelector('#overlay .modal');if(modalEl&&!modalEl.querySelector('.shelfie-tmdb-overview')){
      const node=document.createElement('div');node.className='shelfie-tmdb-overview';node.style.cssText='margin:14px 0;padding:14px;border:1px solid #754b73;border-radius:14px;background:#2a192f;color:#f9d8ed';
      node.innerHTML='<b>About ♡</b><p style="line-height:1.55;margin:9px 0 0">'+esc(x.description)+'</p>';
      const detail=modalEl.querySelector('.detail');if(detail)detail.after(node);
    }}
    // Fetch fresh overview/genres for search results when needed.
    if(!x.description||!x.genre||x.genre==='Movie'||x.genre==='TV Show')request({type:x.tmdbType,id:String(x.tmdbId)}).then(data=>{
      if(!data.item)return;upsert(data.item);
      const el=document.querySelector('#overlay .modal .shelfie-tmdb-overview');if(el)el.innerHTML='<b>About ♡</b><p>'+esc(x.description)+'</p>';
    }).catch(()=>{});
  };
})();
</script>

<!-- Shelfie: unified All search across Open Library + TMDB -->
<style>
.shelfie-all-label{grid-column:1/-1;color:#f0a3d7;font-size:15px;font-weight:800;margin:16px 0 2px}
.shelfie-all-status{grid-column:1/-1;color:#d4aecb;padding:14px 4px}
.shelfie-all-error{grid-column:1/-1;color:#d4aecb;font-size:13px}
</style>
<script>
(function(){
  let timer=null,serial=0;
  const priorUpdate=updateResults;
  const priorSearchPage=searchPage;
  const fallback='https://placehold.co/300x450/38213f/f8b5e4?text=Shelfie';
  function addBook(book){
    const id='openlibrary_'+String(book.key||'').split('/').pop();
    const obj={id,title:book.title||'Untitled',type:'Book',year:String(book.first_publish_year||''),genre:'Book',author:(book.author_name||[]).join(', '),description:'',workKey:book.key,cover:book.cover_i?'https://covers.openlibrary.org/b/id/'+book.cover_i+'-M.jpg':fallback,fallback};
    const old=item(id);if(old)Object.assign(old,obj);else catalog.push(obj);
    return old||obj;
  }
  function addTmdb(x){
    const id='tmdb_'+x.media_type+'_'+x.id;
    const obj={id,title:x.title||'Untitled',type:x.media_type==='movie'?'Movie':'Show',year:x.year||'',genre:(x.genres||[]).join(', ')||(x.media_type==='movie'?'Movie':'TV Show'),description:x.description||'',cover:x.poster||fallback,fallback,tmdbId:x.id,tmdbType:x.media_type,tmdbRating:x.rating,tmdbBackdrop:x.backdrop||''};
    const old=item(id);if(old)Object.assign(old,obj);else catalog.push(obj);
    return old||obj;
  }
  async function books(q){
    const url='https://openlibrary.org/search.json?'+new URLSearchParams({q,fields:'key,title,author_name,cover_i,first_publish_year',limit:'18'});
    const res=await fetch(url);if(!res.ok)throw Error('Book search unavailable');
    const data=await res.json();const seen=new Set();const words=q.toLowerCase().trim().split(/\s+/);
    return (data.docs||[]).filter(b=>b.key&&b.title&&b.cover_i).filter(b=>{
      const title=b.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
      if(!words.every(w=>title.includes(w))||seen.has(title)||/box set|boxed set|bundle/i.test(title))return false;
      seen.add(title);return true;
    }).sort((a,b)=>{const rank=x=>x.title.toLowerCase()===q.toLowerCase()?0:x.title.toLowerCase().startsWith(q.toLowerCase())?1:2;return rank(a)-rank(b)}).slice(0,12).map(addBook);
  }
  async function tmdb(type,q){
    if(typeof SHELFIE_URL==='undefined'||typeof SHELFIE_KEY==='undefined')throw Error('TMDB not configured');
    const url=SHELFIE_URL+'/functions/v1/tmdb-search?'+new URLSearchParams({type,q});
    const res=await fetch(url,{headers:{apikey:SHELFIE_KEY,Authorization:'Bearer '+SHELFIE_KEY}});
    const data=await res.json();if(!res.ok)throw Error(data.error||'Movie and TV search unavailable');
    return (data.results||[]).slice(0,12).map(addTmdb);
  }
  function heading(label,items){return items.length?'<div class="shelfie-all-label">'+label+'</div>'+items.map(coverCard).join(''):''}
  updateResults=function(){
    clearTimeout(timer);const current=++serial;
    if(filter!=='All'){document.getElementById('shelfieTmdbCredit')?.remove();return priorUpdate()}
    const chips=document.querySelector('.chips');if(chips)chips.innerHTML=['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';updateResults()">${f}</button>`).join('');
    const el=document.getElementById('results');if(!el)return;
    const q=search.trim();
    if(q.length<2){el.innerHTML=catalog.filter(x=>!q||x.title.toLowerCase().includes(q.toLowerCase())).slice(0,24).map(coverCard).join('');return}
    el.innerHTML='<div class="shelfie-all-status">Searching books, movies & shows ♡</div>';
    timer=setTimeout(async()=>{
      const outcomes=await Promise.allSettled([books(q),tmdb('movie',q),tmdb('tv',q)]);
      if(current!==serial||tab!=='Search'||filter!=='All'||search.trim()!==q)return;
      const [b,m,t]=outcomes.map(x=>x.status==='fulfilled'?x.value:[]);
      const errors=outcomes.filter(x=>x.status==='rejected');
      el.innerHTML=heading('📖 Books',b)+heading('🎬 Movies',m)+heading('📺 Shows',t)
        ||'<div class="shelfie-all-status">No titles found. Try another search ♡</div>';
      if(errors.length)el.insertAdjacentHTML('beforeend','<div class="shelfie-all-error">Some sources could not load. Please try again ♡</div>');
      document.getElementById('shelfieTmdbCredit')?.remove();
      if(m.length||t.length)el.insertAdjacentHTML('afterend','<div class="shelfie-tmdb-source" id="shelfieTmdbCredit">Movie & TV information provided by TMDB. Not endorsed or certified by TMDB.</div>');
    },350);
  };
  searchPage=function(){const html=priorSearchPage();setTimeout(()=>{if(tab==='Search'&&filter==='All'&&search.trim().length>=2)updateResults()},0);return html};
})();
</script>

<!-- Shelfie dynamic API featured discovery: replaces static search suggestions -->
<style>
.shelfie-featured-head{grid-column:1/-1;margin:12px 0 0;color:#f1b1dc;font-weight:800;font-size:16px}
.shelfie-featured-note{grid-column:1/-1;color:#c8a9c8;font-size:12px;line-height:1.5;margin:0 0 9px}
.shelfie-featured-status{grid-column:1/-1;padding:24px 5px;color:#d6b3d3}
</style>
<script>
(function(){
 let version=0, cached={}, running={};
 const fallback='https://placehold.co/300x450/38213f/f8b5e4?text=Shelfie';
 const previousUpdate=updateResults, previousPage=searchPage;
 function upsert(o){let old=item(o.id);if(old)Object.assign(old,o);else catalog.push(o);return old||o}
 function bookObj(b){return upsert({id:'openlibrary_'+String(b.key).split('/').pop(),title:b.title,type:'Book',year:String(b.first_publish_year||''),genre:'Book',author:(b.author_name||[]).join(', '),workKey:b.key,description:'',cover:'https://covers.openlibrary.org/b/id/'+b.cover_i+'-M.jpg',fallback})}
 function tmdbObj(x){return upsert({id:'tmdb_'+x.media_type+'_'+x.id,title:x.title,type:x.media_type==='movie'?'Movie':'Show',year:x.year||'',genre:(x.genres||[]).join(', ')||'Entertainment',description:x.description||'',cover:x.poster||fallback,fallback,tmdbId:x.id,tmdbType:x.media_type,tmdbRating:x.rating,tmdbBackdrop:x.backdrop||''})}
 async function books(){
  const year=new Date().getFullYear();
  const url='https://openlibrary.org/search.json?'+new URLSearchParams({q:'first_publish_year:['+(year-1)+' TO '+year+'] AND subject:fiction',fields:'key,title,author_name,cover_i,first_publish_year,edition_count',limit:'80'});
  const r=await fetch(url);if(!r.ok)throw Error('Books unavailable');const data=await r.json();let seen=new Set();
  return (data.docs||[]).filter(b=>b.key&&b.title&&b.cover_i&&Number(b.first_publish_year)>=year-1&&Number(b.first_publish_year)<=year).filter(b=>{const name=b.title.toLowerCase().trim();if(seen.has(name)||/box set|bundle|collection|omnibus/i.test(name))return false;seen.add(name);return true}).sort((a,b)=>Number(b.first_publish_year)-Number(a.first_publish_year)||Number(b.edition_count||0)-Number(a.edition_count||0)).slice(0,12).map(bookObj)
 }
 async function tmdb(type){
  const url=SHELFIE_URL+'/functions/v1/tmdb-search?'+new URLSearchParams({type,featured:'1'});
  const r=await fetch(url,{headers:{apikey:SHELFIE_KEY,Authorization:'Bearer '+SHELFIE_KEY}});
  const d=await r.json();if(!r.ok)throw Error(d.error||'TMDB featured titles unavailable');return (d.results||[]).filter(x=>x.poster).slice(0,12).map(tmdbObj)
 }
 function get(key){if(cached[key]&&Date.now()-cached[key].time<3600000)return Promise.resolve(cached[key].items);if(running[key])return running[key];running[key]=(key==='Books'?books():tmdb(key==='Movies'?'movie':'tv')).then(items=>{cached[key]={items,time:Date.now()};return items}).finally(()=>delete running[key]);return running[key]}
 function label(k){return k==='Books'?'📖 Featured books':k==='Movies'?'🎬 Featured movies':'📺 Featured shows'}
 function paint(key,items){return '<div class="shelfie-featured-head">'+label(key)+'</div>'+items.map(coverCard).join('')+(items.length?'':'<div class="shelfie-featured-note">No featured titles available right now ♡</div>')}
 async function featured(){const id=++version, el=document.getElementById('results');if(!el)return;
  const active=filter,keys=active==='All'?['Books','Movies','Shows']:[active];
  el.innerHTML='<div class="shelfie-featured-status">Finding fresh favorites for you ✨</div>';
  const outcomes=await Promise.allSettled(keys.map(get));if(id!==version||tab!=='Search'||search.trim()||filter!==active)return;
  el.innerHTML=outcomes.map((o,i)=>o.status==='fulfilled'?paint(keys[i],o.value):'<div class="shelfie-featured-head">'+label(keys[i])+'</div><div class="shelfie-featured-note">Could not load right now. Try refreshing ♡</div>').join('');
  document.getElementById('shelfieTmdbCredit')?.remove();
  if(keys.includes('Movies')||keys.includes('Shows'))el.insertAdjacentHTML('afterend','<div class="shelfie-tmdb-source" id="shelfieTmdbCredit">Movie & TV information provided by TMDB. Not endorsed or certified by TMDB.</div>');
 }
 updateResults=function(){++version;if(!search.trim()){const chips=document.querySelector('.chips');if(chips)chips.innerHTML=['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';updateResults()">${f}</button>`).join('');featured();return}document.getElementById('shelfieTmdbCredit')?.remove();previousUpdate()};
 searchPage=function(){const html=previousPage();setTimeout(()=>{if(tab==='Search'&&!search.trim())updateResults()},0);return html};
})();
</script>

<style>

<script>
(function(){
 let seq=0, cache={}, pending={};
 const originalHome=home, originalRender=render;
 const fallback='https://placehold.co/300x450/38213f/f8b5e4?text=Shelfie';
 function store(x){let found=item(x.id);if(found){Object.assign(found,x);return found}catalog.push(x);return x}
 function book(x){return store({id:'openlibrary_'+String(x.key).split('/').pop(),title:x.title,type:'Book',year:String(x.first_publish_year||''),genre:'Book',author:(x.author_name||[]).join(', '),workKey:x.key,description:'',cover:'https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg',fallback})}
 function media(x){return store({id:'tmdb_'+x.media_type+'_'+x.id,title:x.title,type:x.media_type==='movie'?'Movie':'Show',year:x.year||'',genre:(x.genres||[]).join(', ')||'Entertainment',description:x.description||'',cover:x.poster||fallback,fallback,tmdbId:x.id,tmdbType:x.media_type,tmdbRating:x.rating,tmdbBackdrop:x.backdrop||''})}
 async function fetchBooks(){const y=new Date().getFullYear();const url='https://openlibrary.org/search.json?'+new URLSearchParams({q:'first_publish_year:['+(y-1)+' TO '+y+'] AND subject:fiction',fields:'key,title,author_name,cover_i,first_publish_year,edition_count',limit:'80'});const r=await fetch(url);if(!r.ok)throw Error('Books unavailable');const d=await r.json(),seen=new Set();return(d.docs||[]).filter(x=>x.key&&x.title&&x.cover_i&&Number(x.first_publish_year)>=y-1&&Number(x.first_publish_year)<=y).filter(x=>{const t=x.title.toLowerCase().trim();if(seen.has(t)||/box set|bundle|collection|omnibus/i.test(t))return false;seen.add(t);return true}).sort((a,b)=>Number(b.first_publish_year)-Number(a.first_publish_year)||Number(b.edition_count||0)-Number(a.edition_count||0)).slice(0,10).map(book)}
 async function fetchMedia(kind){const url=SHELFIE_URL+'/functions/v1/tmdb-search?'+new URLSearchParams({type:kind==='Movies'?'movie':'tv',featured:'1'});const r=await fetch(url,{headers:{apikey:SHELFIE_KEY,Authorization:'Bearer '+SHELFIE_KEY}});const d=await r.json();if(!r.ok)throw Error(d.error||'TMDB unavailable');return(d.results||[]).filter(x=>x.poster).slice(0,10).map(media)}
 function get(k){if(cache[k]&&Date.now()-cache[k].at<3600000)return Promise.resolve(cache[k].list);if(pending[k])return pending[k];pending[k]=(k==='Books'?fetchBooks():fetchMedia(k)).then(list=>{cache[k]={list,at:Date.now()};return list}).finally(()=>delete pending[k]);return pending[k]}
 function section(k,list){const label=k==='Books'?'📖 Featured books':k==='Movies'?'🎬 Featured movies':'📺 Featured shows';return '<div class="shelfie-home-fresh-section"><div class="shelfie-home-fresh-title">'+label+'</div><div class="shelfie-home-fresh-rail">'+list.map(coverCard).join('')+'</div>'+(list.length?'':'<div class="shelfie-home-fresh-note">No new titles available right now ♡</div>')+'</div>'}
 async function update(){const el=document.getElementById('shelfieHomeFresh');if(!el||tab!=='Home')return;const id=++seq,active=filter,keys=active==='All'?['Books','Movies','Shows']:[active];el.innerHTML='<div class="shelfie-home-fresh-note">Finding fresh favorites ✨</div>';const results=await Promise.allSettled(keys.map(get));if(id!==seq||tab!=='Home'||filter!==active||!document.getElementById('shelfieHomeFresh'))return;el.innerHTML=results.map((r,i)=>r.status==='fulfilled'?section(keys[i],r.value):'<div class="shelfie-home-fresh-section"><div class="shelfie-home-fresh-title">'+(keys[i]==='Books'?'📖 Featured books':keys[i]==='Movies'?'🎬 Featured movies':'📺 Featured shows')+'</div><div class="shelfie-home-fresh-note">Could not load right now. Refresh to try again ♡</div></div>').join('')+(keys.some(k=>k!=='Books')?'<div class="shelfie-tmdb-source">Movie & TV information provided by TMDB. Not endorsed or certified by TMDB.</div>':'')}
 home=function(){let html=originalHome();const heading='<div class="sectionhead"><h2>✦ Discover something good</h2>';const start=html.indexOf(heading);if(start<0)return html;const rail=html.indexOf('<div class="coverrail">',start);if(rail<0)return html;const next=html.indexOf('<div class="sectionhead">',rail+1);if(next<0)return html;return html.slice(0,rail)+'<div id="shelfieHomeFresh"><div class="shelfie-home-fresh-note">Finding fresh favorites ✨</div></div>'+html.slice(next)};
 render=function(){originalRender();if(tab==='Home')update()};
 setTimeout(()=>{if(tab==='Home')update()},150);
})();
</script>
