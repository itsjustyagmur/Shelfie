<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shelfie — rate • review • together</title>
<!-- SHELFIE STYLES · 01 -->
<style>
:root{--bg:#09090f;--surface:#171620;--surface2:#24212e;--pink:#f5a4df;--pink2:#d76bb8;--text:#faf3fa;--muted:#aaa3b4;--line:#35303f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink)}.app{max-width:560px;margin:auto;min-height:100dvh;padding:0 17px 105px;background:radial-gradient(ellipse at 50% -20%,#2b1632,transparent 65%)}header{position:sticky;top:0;z-index:5;background:#0b0a11e8;backdrop-filter:blur(18px);margin:0 -17px;padding:17px 20px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff0e}.brand{font-family:Georgia,serif;color:#f9b8eb;font-size:33px;letter-spacing:-2px}.brand span{font-family:inherit;font-size:18px}.header-right{display:flex;gap:9px}.iconbtn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:10px 12px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--pink);font-weight:800}.hero{padding:25px 0 20px}.hero h1{font-size:30px;letter-spacing:-1.1px;margin:6px 0 7px}.muted{color:var(--muted)}p{line-height:1.45}.tabs,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 15px;border-radius:30px}.chip.active{background:linear-gradient(135deg,#f9c3e9,#dd84c5);color:#241222;border-color:transparent;font-weight:750}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 13px}.sectionhead h2{font-size:18px;margin:0}.tiny{font-size:12px}.coverrail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.coveritem{min-width:116px;width:116px;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#33283b;border-radius:13px;border:1px solid #ffffff22;box-shadow:0 8px 22px #0007}.coveritem b{display:block;font-size:12px;margin:8px 0 3px;line-height:1.25}.coveritem small{color:var(--muted)}.stars{color:#f8a0d6;letter-spacing:1px}.feedcard,.panel{background:linear-gradient(155deg,#211b2a,#15141d);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}.feedtop{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f4a9e1,#8b4e9d);display:grid;place-items:center;color:#2b1330;font-weight:850;flex-shrink:0}.feedbody{display:flex;gap:13px;margin-top:14px}.feedbody img{width:76px;height:112px;object-fit:cover;border-radius:9px}.feedbody h3{margin:0 0 4px;font-size:17px}.feedbody p{margin:8px 0;font-size:13px}.subtle{font-size:12px;color:var(--muted)}.actions{display:flex;gap:12px;margin-top:14px}.linkbtn{background:transparent;border:0;color:var(--pink);padding:4px 0;font-weight:650}.primary{background:linear-gradient(135deg,#f9bde5,#e88ac9);border:0;color:#291427;border-radius:13px;padding:12px 17px;font-weight:800}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px 15px}.full{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;display:flex;justify-content:space-around;background:#15121df5;backdrop-filter:blur(16px);border-top:1px solid #46334c;padding:11px 4px calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;border:0;color:#b8aabd;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;min-width:58px}.nav button span{font-size:22px}.nav button.active{color:var(--pink)}.nav .plus span{border-radius:50%;background:var(--pink);color:#231121;width:43px;height:43px;display:grid;place-items:center;font-size:27px;margin-top:-22px;box-shadow:0 5px 22px #f5a4df55}.searchbox, input,textarea,select{width:100%;background:#25212f;border:1px solid #43394c;color:var(--text);border-radius:13px;padding:13px;outline:none}.searchbox{margin:15px 0}textarea{min-height:100px;resize:vertical}.gridcovers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.gridcovers .coveritem{width:auto;min-width:0}.groupcard{padding:17px;background:linear-gradient(120deg,#322037,#1b1924);border:1px solid #57415a;border-radius:19px;margin:12px 0;cursor:pointer}.groupcard h3{margin:0 0 5px}.groupcard .badge{display:inline-block;background:#f0a5d91c;border:1px solid #a9639560;color:#f6b6e5;border-radius:20px;padding:5px 10px;font-size:11px;margin-top:9px}.profiletop{text-align:center;padding:30px 0 17px}.profiletop .avatar{width:82px;height:82px;font-size:32px;margin:0 auto 12px}.stats{display:flex;justify-content:space-around;margin:17px 0}.stats b{font-size:20px;display:block}.stats small{color:var(--muted)}.modalwrap{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:#1b1723;border:1px solid #66466a;border-radius:24px 24px 0 0;padding:22px;max-width:560px;width:100%;max-height:91dvh;overflow:auto;box-shadow:0 -20px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:21px}.field{margin:13px 0}.field label{display:block;margin-bottom:7px;color:#d9c8d9;font-size:13px}.rateStars{display:flex;gap:8px;margin:14px 0}.rateStars button{background:none;border:0;color:#655569;font-size:37px;padding:0}.rateStars button.on{color:#f7a5d9}.detail{display:flex;gap:15px}.detail img{width:116px;height:174px;object-fit:cover;border-radius:12px}.detail h2{margin:3px 0 5px}.comment{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.comment b{color:var(--pink)}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.hide{display:none!important}.notice{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#f5b1df;color:#291427;border-radius:15px;padding:12px 20px;z-index:40;font-weight:700;box-shadow:0 12px 35px #0009}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.spaced{justify-content:space-between}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}a{color:var(--pink)}@media(min-width:700px){body{background:radial-gradient(ellipse at top,#321c37,#08070d 60%)}.app{border-left:1px solid #34263c;border-right:1px solid #34263c}}
</style>
<!-- Prevent the temporary guest profile from flashing during account restoration. -->
<style>
html.shelfie-profile-boot #screen { visibility:hidden !important; }
html.shelfie-profile-boot .app::after {
  content:"Loading your Shelfie ♡";
  position:fixed; z-index:9; left:50%; top:43%; transform:translate(-50%,-50%);
  color:#f5a4df; font-weight:700; letter-spacing:.3px;
  background:#1b1723; border:1px solid #66466a;
  border-radius:18px; padding:20px 26px; white-space:nowrap;
}
</style>
<script>
try {
  if (sessionStorage.getItem('shelfie-current-page') === 'Profile') {
    document.documentElement.classList.add('shelfie-profile-boot');
  }
} catch (_) {}
</script>
</head><body><div class="app"><header><div class="brand">shelfie<span> ✦</span></div><div class="header-right"><button class="iconbtn" onclick="openSearch()" aria-label="Search">⌕</button><button class="iconbtn" onclick="openInvite()" aria-label="Share">↗</button></div></header><main id="screen"><section class="hero"><div class="eyebrow">SHELFIE ✦</div><h1>Good stories. Better company.</h1><p>Welcome to Shelfie! If this message stays visible, your file viewer is blocking JavaScript. Open Shelfie in a full web browser or host it on a website.</p></section></main></div><nav class="nav" id="nav"></nav><div id="overlay"></div>

<script>
const catalog=[
{id:'b1',title:'Fourth Wing',type:'Book',year:'2023',genre:'Fantasy romance',cover:'https://covers.openlibrary.org/b/isbn/9781649374042-L.jpg',fallback:'https://placehold.co/300x450/38213f/f8b5e4?text=Fourth+Wing'},
{id:'b2',title:'The Housemaid',type:'Book',year:'2022',genre:'Thriller',cover:'https://covers.openlibrary.org/b/isbn/9781538742570-L.jpg',fallback:'https://placehold.co/300x450/25374b/f8b5e4?text=The+Housemaid'},
{id:'b3',title:'A Court of Thorns and Roses',type:'Book',year:'2015',genre:'Fantasy',cover:'https://covers.openlibrary.org/b/isbn/9781635575569-L.jpg',fallback:'https://placehold.co/300x450/4a2338/f8b5e4?text=ACOTAR'},
{id:'b4',title:'The Silent Patient',type:'Book',year:'2019',genre:'Mystery',cover:'https://covers.openlibrary.org/b/isbn/9781250301697-L.jpg',fallback:'https://placehold.co/300x450/3b293b/f8b5e4?text=Silent+Patient'},
{id:'m1',title:'Barbie',type:'Movie',year:'2023',genre:'Comedy',cover:'https://image.tmdb.org/t/p/w500/iuFNMS8U5cb6xfzi51Dbkovj7vM.jpg',fallback:'https://placehold.co/300x450/b94389/ffffff?text=Barbie'},
{id:'m2',title:'Dune: Part Two',type:'Movie',year:'2024',genre:'Sci-fi',cover:'https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg',fallback:'https://placehold.co/300x450/614b36/ffffff?text=Dune+Part+Two'},
{id:'m3',title:'Interstellar',type:'Movie',year:'2014',genre:'Sci-fi',cover:'https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg',fallback:'https://placehold.co/300x450/24314a/ffffff?text=Interstellar'},
{id:'s1',title:'The Last of Us',type:'Show',year:'2023',genre:'Drama',cover:'https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg',fallback:'https://placehold.co/300x450/26382f/ffffff?text=The+Last+of+Us'},
{id:'s2',title:'Stranger Things',type:'Show',year:'2016',genre:'Sci-fi',cover:'https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg',fallback:'https://placehold.co/300x450/4b202e/ffffff?text=Stranger+Things'},
{id:'s3',title:'Wednesday',type:'Show',year:'2022',genre:'Mystery',cover:'https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg',fallback:'https://placehold.co/300x450/2b283a/ffffff?text=Wednesday'}];
const key='shelfie-prototype-v1';const defaults={name:'Yagmur',handle:'@yagmurreads',reviews:[{id:'b1',stars:5,text:'Dragons, drama, and a romance I cannot stop thinking about.',date:'Today'},{id:'s1',stars:5,text:'The performances and the storytelling? Incredible.',date:'Yesterday'}],comments:{b1:[{name:'Emma',text:'Team Xaden forever! 💗'}],s1:[{name:'Lily',text:'I need the next season immediately.'}]},groups:[{id:'g1',name:'Spicy Book Club 🔥',description:'Fantasy romance, dragons, and all the plot twists.',members:['Yagmur','Emma','Lily'],posts:[{name:'Emma',text:'What are we reading next? 📚'}]},{id:'g2',name:'Movie Night 🎬',description:'Our next favorite Friday-night watch.',members:['Yagmur','Shane'],posts:[{name:'Shane',text:'Dune rewatch this weekend?'}]}],saved:['b3','m2'],likes:[]};
let state;try{state={...JSON.parse(JSON.stringify(defaults)),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state=JSON.parse(JSON.stringify(defaults))};
 let tab=sessionStorage.getItem('shelfie-current-page')||'Home',filter='All',search='',selected=null,groupSelected=null,starValue=5;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){toast('Browser storage unavailable; changes last until refresh')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function item(id){return catalog.find(x=>x.id===id)}function imageTag(x,cls='cover'){return `<img class="${cls}" src="${x.cover}" alt="${esc(x.title)} cover" loading="lazy" onerror="if(this.src!=='${x.fallback}')this.src='${x.fallback}'">`}function toast(s){document.querySelector('.notice')?.remove();let d=document.createElement('div');d.className='notice';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2300)}function avg(id){let r=state.reviews.filter(x=>x.id===id);return r.length?(r.reduce((a,b)=>a+b.stars,0)/r.length).toFixed(1):'—'}function coverCard(x){return `<div class="coveritem" onclick="openDetail('${x.id}')">${imageTag(x)}<b>${esc(x.title)}</b><small>${x.type} · <span class="stars">★</span> ${avg(x.id)}</small></div>`}function nav(){document.getElementById('nav').innerHTML=[['Home','⌂'],['Search','⌕'],['Add','+'],['Groups','♧'],['Profile','♙']].map(([n,ic])=>`<button class="${tab===n?'active':''} ${n==='Add'?'plus':''}" onclick="${n==='Add'?'openAdd()':`go('${n}')`}"><span>${ic}</span>${n==='Add'?'':n}</button>`).join('')} function go(t){
  tab=t;
  sessionStorage.setItem('shelfie-current-page',t);
  filter='All';
  search='';
  render();
  window.scrollTo(0,0);
} function render(){nav();let el=document.getElementById('screen');if(tab==='Home')el.innerHTML=home();if(tab==='Search')el.innerHTML=searchPage();if(tab==='Groups')el.innerHTML=groupsPage();if(tab==='Profile')el.innerHTML=profilePage();if(tab==='Add')el.innerHTML=home()}function home(){return `<section class="hero"><div class="eyebrow">Your little corner of culture ✦</div><h1>Good stories. Better company.</h1><div class="muted">Your next obsession starts here.</div></section><div class="tabs">${['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="sectionhead"><h2>✦ Discover something good</h2><button class="linkbtn" onclick="go('Search')">See all →</button></div><div class="coverrail">${catalog.filter(x=>filter==='All'||x.type===(filter==='Shows'?'Show':filter.slice(0,-1))).map(coverCard).join('')}</div><div class="sectionhead"><h2>💗 Your circle</h2><span class="subtle">Recent reviews</span></div>${state.reviews.filter(r=>filter==='All'||item(r.id)?.type===(filter==='Shows'?'Show':filter.slice(0,-1))).slice().reverse().map(r=>feedCard(r)).join('')||'<div class="empty">No reviews yet. Be the first to rate something!</div>'}<div class="sectionhead"><h2>✨ Your groups</h2><button class="linkbtn" onclick="go('Groups')">View groups →</button></div>${state.groups.slice(0,2).map(groupCard).join('')}`}function feedCard(r){let x=item(r.id);if(!x)return '';return `<div class="feedcard"><div class="feedtop"><div class="avatar">${esc(state.name[0]||'Y')}</div><div><b>${esc(state.name)}</b> <span class="subtle">rated a ${x.type.toLowerCase()}</span><div class="subtle">${esc(r.date||'Recently')}</div></div></div><div class="feedbody" onclick="openDetail('${x.id}')" style="cursor:pointer">${imageTag(x,'')}<div><h3>${esc(x.title)}</h3><div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div><p>${esc(r.text)}</p><span class="subtle">${x.type} · ${x.year}</span></div></div><div class="actions"><button class="linkbtn" onclick="toggleLike('${x.id}')">${state.likes.includes(x.id)?'♥ Liked':'♡ Like'}</button><button class="linkbtn" onclick="openDetail('${x.id}')">💬 ${state.comments[x.id]?.length||0} comments</button></div></div>`}function searchPage(){let list=catalog.filter(x=>(filter==='All'||x.type===(filter==='Shows'?'Show':filter.slice(0,-1)))&&(`${x.title} ${x.genre} ${x.type}`).toLowerCase().includes(search.toLowerCase()));return `<div class="hero"><div class="eyebrow">Find your next favorite</div><h1>Explore</h1></div><input class="searchbox" id="searchInput" placeholder="Search books, movies, shows..." value="${esc(search)}" oninput="search=this.value;updateResults()"><div class="chips">${['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';updateResults()">${f}</button>`).join('')}</div><div id="results" class="gridcovers">${list.map(coverCard).join('')}</div>`}function updateResults(){document.querySelector('.chips').innerHTML=['All','Books','Movies','Shows'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';updateResults()">${f}</button>`).join('');document.getElementById('results').innerHTML=catalog.filter(x=>(filter==='All'||x.type===(filter==='Shows'?'Show':filter.slice(0,-1)))&&(`${x.title} ${x.genre} ${x.type}`).toLowerCase().includes(search.toLowerCase())).map(coverCard).join('')||'<p class="muted">No titles found.</p>'}function groupCard(g){return `<div class="groupcard" onclick="openGroup('${g.id}')"><div class="row spaced"><h3>${esc(g.name)}</h3><span style="color:var(--pink)">↗</span></div><div class="muted tiny">${esc(g.description)}</div><span class="badge">♧ ${g.members.length} members</span> <span class="badge">💬 ${g.posts.length} posts</span></div>`}function groupsPage(){return `<div class="hero"><div class="eyebrow">The best part is sharing</div><h1>Your groups ♡</h1><div class="muted">Your people, your stories, your opinions.</div></div><button class="primary full" onclick="openCreateGroup()">＋ Create a group</button><div class="sectionhead"><h2>Groups you're in</h2><span class="subtle">${state.groups.length} groups</span></div>${state.groups.map(groupCard).join('')}`}function profilePage(){return `<div class="profiletop"><div class="avatar">${esc(state.name[0]||'Y')}</div><h2 style="margin:0">${esc(state.name)}</h2><div class="muted">${esc(state.handle)}</div><button class="secondary" style="margin-top:13px" onclick="editProfile()">Edit profile ✎</button><div class="stats"><div><b>${state.reviews.length}</b><small>Ratings</small></div><div><b>${Object.values(state.comments).flat().filter(c=>c.name===state.name).length}</b><small>Comments</small></div><div><b>${state.groups.length}</b><small>Groups</small></div></div></div><div class="sectionhead"><h2>♡ My watchlist & TBR</h2></div><div class="coverrail">${state.saved.map(id=>item(id)).filter(Boolean).map(coverCard).join('')||'<div class="muted">Your saved titles will appear here.</div>'}</div><div class="sectionhead"><h2>★ My reviews</h2></div>${state.reviews.slice().reverse().map(feedCard).join('')||'<div class="empty">Your ratings will appear here.</div>'}<button class="secondary full" onclick="openInvite()">↗ Share my profile</button>`}function modal(title,body){document.getElementById('overlay').innerHTML=`<div class="modalwrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('overlay').innerHTML=''}function openDetail(id){selected=id;let x=item(id),comments=state.comments[id]||[],my=state.reviews.find(r=>r.id===id);modal('Details ✦',`<div class="detail">${imageTag(x,'')}<div><div class="eyebrow">${x.type} · ${x.year}</div><h2>${esc(x.title)}</h2><div class="muted">${esc(x.genre)}</div><p class="stars">★ ${avg(id)} <span class="subtle">(${state.reviews.filter(r=>r.id===id).length} ratings)</span></p><button class="primary" onclick="openReview('${id}')">${my?'Edit rating':'★ Rate & review'}</button></div></div><div class="row" style="margin-top:15px"><button class="secondary full" onclick="toggleSave('${id}')">${state.saved.includes(id)?'✓ Saved to list':'＋ Add to watchlist / TBR'}</button></div><hr class="divider"><h3>Community discussion</h3><div id="commentList">${comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join('')||'<p class="muted">Start the conversation!</p>'}</div><form onsubmit="addComment(event,'${id}')"><div class="field"><input id="commentText" required maxlength="500" placeholder="Add a comment..."></div><button class="primary full" type="submit">Post comment</button></form>`)}function openReview(id){selected=id;let x=item(id),r=state.reviews.find(r=>r.id===id);starValue=r?.stars||5;modal('Rate & review',`<div class="row">${imageTag(x,'')}<div><h3>${esc(x.title)}</h3><div class="muted">${x.type} · ${x.year}</div></div></div><div class="field"><label>Your rating</label><div class="rateStars" id="rateStars">${starButtons()}</div></div><div class="field"><label>Your thoughts</label><textarea id="reviewText" placeholder="What did you think?">${esc(r?.text||'')}</textarea></div><button class="primary full" onclick="submitReview('${id}')">Save my review ♡</button>`)}function starButtons(){return [1,2,3,4,5].map(n=>`<button class="${n<=starValue?'on':''}" onclick="starValue=${n};document.getElementById('rateStars').innerHTML=starButtons()">★</button>`).join('')}function submitReview(id){let text=document.getElementById('reviewText').value.trim();state.reviews=state.reviews.filter(r=>r.id!==id);state.reviews.push({id,stars:starValue,text,date:'Just now'});save();closeModal();render();toast('Review saved ✨')}function addComment(e,id){e.preventDefault();let text=document.getElementById('comment on class="primary full" onclick="shareText('Check out Shelfie — let’s rate books, movies and shows together!')">↗ Share Shelfie</button><p class="subtle">This is a local HTML prototype. Friends can open their own copy, but accounts and group messages are not synced across devices yet.</p>`)}async function shareText(text){try{if(navigator.share)await navigator.share({title:'Shelfie',text,url:location.protocol==='file:'?undefined:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+(location.protocol==='file:'?'':location.href));toast('Copied to clipboard!')}else toast('Sharing not supported in this browser')}catch(e){if(e.name!=='AbortError')toast('Unable to share')}}function openSearch(){go('Search');setTimeout(()=>document.getElementById('searchInput')?.focus(),50)}render();

<script>

        </div>

        <button class="primary full" type="submit">
          Save my profile ♡
        </button>
      </form>
    `);
  };

  window.saveShelfieEdit = async function (e) {
    e.preventDefault();

    const button = e.submitter;
    if (button) button.disabled = true;

    const display_name = document.getElementById('editName').value.trim();
    const username = document.getElementById('editHandle').value.trim().toLowerCase();
    const bio = document.getElementById('editBio').value.trim();
    const status = document.getElementById('editStatus').value.trim();

    try {
      const { error } = await cloud
        .from('profiles')
        .update({ display_name, username, bio, status })
        .eq('id', cloudUser.id);

      if (error) throw error;

      state.name = display_name;
      state.handle = '@' + username;
      save();

      if (cloudProfile) {
        Object.assign(cloudProfile, {
          display_name, username, bio, status
        });
      }

      closeModal();
      render();
      toast('Your Shelfie is updated! 💗');
    } catch (err) {
      toast(err.message || 'Could not save profile');

<script>
(function () {
  const previousOpenDetail = openDetail;

  
const bookStatuses = {};

function bookStatusKey() {
  return 'shelfie-book-statuses-' +
    (cloudUser?.id || 'guest');
}

function loadBookStatuses() {
  let saved = {};

  try {
    saved = JSON.parse(
      localStorage.getItem(bookStatusKey()) || '{}'
    );
  } catch {
    saved = {};
  }

  Object.keys(bookStatuses).forEach(
    id => delete bookStatuses[id]
  );

  Object.assign(bookStatuses, saved);
}

function saveBookStatuses() {
  localStorage.setItem(
    bookStatusKey(),
    JSON.stringify(bookStatuses)
  );
}


  function getStatus(id) {
    if (bookStatuses[id]) return bookStatuses[id];
    if (state.reviews.some(r => r.id === id)) return 'read';
    if (state.saved.includes(id)) return 'tbr';
    return 'none';
  }

  function setBookStatus(id, status) {
    bookStatuses[id] = status;
    saveBookStatuses();

    state.saved = state.saved.filter(x => x !== id);
    if (status === 'tbr') state.saved.push(id);

    save();
    openDetail(id);
    toast(status === 'read'
      ? 'Added to your Read list ♡'
      : status === 'tbr'
        ? 'Added to your TBR ♡'
        : 'Removed from list');
  }

  window.shelfieBookStatus = function (id, status) {
    setBookStatus(id, getStatus(id) === status ? 'none' : status);
  };

  window.shelfieBookAbout = async function (id) {
    const book = item(id);
    const output = document.getElementById('shelfieBookAbout');
    if (!book || !output) return;

    if (!output.hidden) {
      output.hidden = true;
      return;
    }

    output.hidden = false;

    if (!book.description && book.workKey) {
      output.textContent = 'Loading description... ♡';

      try {
        const response = await fetch(
          'https://openlibrary.org' + book.workKey + '.json'
        );

        if (!response.ok) throw new Error('Unavailable');

        const data = await response.json();

        book.description =
          typeof data.description === 'string'
            ? data.description
            : data.description?.value || '';
      } catch (error) {
        output.textContent =
          'Could not load the description. Please try again.';
        return;
      }
    }

    output.textContent = book.description ||
      'A description is not available for this book yet.';
  };

  window.shelfieBookRate = function (id, stars) {
    const existing = state.reviews.find(r => r.id === id);
    starValue = stars;

    if (existing) {
      existing.stars = stars;
      existing.date = 'Just now';
      save();
      setBookStatus(id, 'read');
      toast('Rating updated ♡');
    } else {
      openReview(id);
    }
  };

  window.shelfieBookRecommend = function (id) {
    const book = item(id);

    modal('Recommend this book ♡', `
      <p class="muted">
        Share ${esc(book.title)} with someone you love!
      </p>

      <button class="shelfie-book-button"
        onclick="shareText('I recommend ${esc(book.title)} on Shelfie! ♡')">
        ↗ Share with a friend
      </button>

      <p class="cloudhint">
        Direct recommendations to Shelfie friends and groups
        will be added when we connect messaging.
      </p>

      <button class="secondary full"
        onclick="openDetail('${id}')">
        ← Back to book
      </button>
    `);
  };

  openDetail = function (id) {
    const book = item(id);

    if (!book || book.type !== 'Book') {
      previousOpenDetail(id);
      return;
    }

    selected = id;

    const review = state.reviews.find(r => r.id === id);
    const rating = review?.stars || 0;
    const status = getStatus(id);

    const stars = [1, 2, 3, 4, 5].map(n => `
      <button
        aria-label="Rate ${n} stars"
        onclick="shelfieBookRate('${id}', ${n})">
        ${n <= rating ? '★' : '☆'}
      </button>
    `).join('');

    modal('Book details ♡', `
      <div class="shelfie-book-detail">

        <div class="shelfie-book-top">
          ${imageTag(book, '')}

          <div class="shelfie-book-info">
            <h3>${esc(book.title)}</h3>
            <p>${esc(book.author || 'Author unavailable')}</p>
            <small>
              ${esc(book.year)} · ${esc(book.genre)}
            </small>

            <div class="shelfie-pink-stars">
              ${stars}
            </div>

            <button class="shelfie-book-button"
              onclick="shelfieBookAbout('${id}')">
              ⓘ About
            </button>
          </div>
        </div>

        <div id="shelfieBookAbout"
          class="shelfie-about-text" hidden></div>

        <div class="shelfie-book-actions">

          <button class="shelfie-book-button"
            onclick="shelfieBookStatus('${id}', 'read')">
            ${status === 'read' ? '✓ Read' : '✓ Mark as Read'}
          </button>

          <button class="shelfie-book-button"
            onclick="shelfieBookStatus('${id}', 'tbr')">

<!-- ============================================================

<script>
(function () {
  window.shelfieBookRecommend = async function (id) {
    const book = item(id);
    if (!book) return;

    if (!cloudUser || !cloud) {
      toast('Sign in to recommend books ♡');
      openAccount();
      return;
    }

    modal('Recommend a book ♡', `
      <div class="shelfie-book-detail">
        <div class="row" style="align-items:flex-start">
          ${imageTag(book, '')}
          <div>
            <h3>${esc(book.title)}</h3>
            <p class="muted">Send this to a Shelfie friend ♡</p>
          </div>
        </div>

        <div class="field">
          <label>Choose a friend</label>
          <select id="recommendFriend">
            <option value="">Loading friends...</option>
          </select>
        </div>

        <div class="field">
          <label>Your message ♡</label>
          <textarea id="recommendMessage"
            maxlength="1000"
            placeholder="You HAVE to read this! ♡"></textarea>
        </div>

        <button class="shelfie-book-button"
          onclick="shelfieSendRecommendation('${id}')">
          ♡ Send Recommendation
        </button>

        <button class="shelfie-book-button"
          style="margin-top:10px"
          onclick="openDetail('${id}')">
          ← Back to Book
        </button>
      </div>
    `);

    const select = document.getElementById('recommendFriend');

    const { data: follows, error } = await cloud
      .from('follows')
      .select('following_id')
      .eq('follower_id', cloudUser.id);

    if (!select) return;

    if (error) {
      select.innerHTML = '<option value="">Could not load friends</option>';
      toast(error.message);
      return;
    }

    const ids = (follows || []).map(f => f.following_id);

    if (!ids.length) {
      select.innerHTML = '<option value="">Follow friends first ♡</option>';
      return;
    }

    const { data: friends, error: profileError } = await cloud
      .from('profiles')
      .select('id,username,display_name')
      .in('id', ids);

    if (profileError) {
      select.innerHTML = '<option value="">Could not load friends</option>';
      toast(profileError.message);
      return;
    }

    select.innerHTML = '<option value="">Choose a friend ♡</option>' +
      (friends || []).map(friend =>
        `<option value="${friend.id}">
          ${esc(friend.display_name || friend.username)}
          (@${esc(friend.username)})
        </option>`
      ).join('');
  };

  window.shelfieSendRecommendation = async function (id) {
    const book = item(id);
    const recipient_id = document.getElementById('recommendFriend')?.value;
    const message = document.getElementById('recommendMessage')?.value.trim() || '';

    if (!book || !recipient_id) {
      toast('Choose a friend first ♡');
      return;
    }

    const { error } = await cloud
      .from('book_recommendations')
      .insert({
        sender_id: cloudUser.id,
        recipient_id,
        book_id: id,
        book_title: book.title,
        book_cover: book.cover || null,
        book_author: book.author || null,
        book_year: book.year || null,
        book_work_key: book.workKey || null,
        message,
        status: 'pending'
      });

    if (error) {
      toast('Could not send: ' + error.message);
      return;
    }

    closeModal();
    toast('Recommendation sent! ♡');
  };
})();
</script>

<script>
(function () {
  const legacyKey = 'shelfie-prototype-v1';
  const personalPrefix = 'shelfie-account-v2-';
  const originalRender = render;
  const originalRefresh = refreshCloud;
  const originalSave = save;
  const originalSubmitReview = submitReview;
  const originalAddComment = addComment;
  const originalPostGroup = postGroup;
  const originalCreateGroup = createGroup;
  const originalBookStatus = window.shelfieBookStatus;
  const originalOpenDetail = openDetail;

  let activeAccount = null;
  let ready = false;

  function emptyData() {
    return {
      reviews:[],
      comments:{},
      groups:[],
      saved:[],
      likes:[],
      completed:[],
      activity:[]
    };
  }

  function storageKey(id) {
    return personalPrefix + id;
  }

  function safeRead(key) {
    try {
      return JSON.parse(localStorage.getItem(key) || 'null');
    } catch {
      return null;
    }
  }

  function loadAccount() {
    const id = cloudUser?.id || 'guest';

    if (ready && activeAccount === id) return;

    // Save the previous account's changes before switching.
  

    let data = safeRead(storageKey(id));

    // Preserve the original owner's demo-era data.
    // Other users always begin with empty collections.
    if (!data && cloudUser &&
        cloudProfile?.username === 'yagmurreads') {
      const old = safeRead(legacyKey);
      if (old) {
        data = Object.assign(emptyData(), old);
      }
    }

    state = Object.assign(emptyData(), data || {});
    state.comments ||= {};
    state.activity ||= [];
    state.completed ||= [];

    activeAccount = id;
    ready = true;
  }

  save = function () {
    loadAccount();
    try {
      localStorage.setItem(
        storageKey(activeAccount),
        JSON.stringify(state)
      );
    } catch {
      toast('Could not save on this device');
    }
  };

  function isFinished(id) {
    return state.completed.includes(id);

          <div class="shelfie-status">
            <div class="eyebrow">✦ MY STATUS</div>
            <p>${esc(status)}</p>
          </div>
        ` : ''}

        <button class="secondary"
          style="margin-top:13px"
          onclick="editProfile()">
          Edit profile ✎
        </button>
      </div>

      <div class="shelfie-profile-stats">
        ${stat('♡', cloudFollowing.length,
          'Friends','friends')}

        ${stat('★', state.reviews.length,
          'Ratings','ratings')}

        ${stat('♧', state.groups.length,
          'Groups','groups')}

        ${stat('📖', finishedItems('Book').length,
          'Books Read','books')}

        ${stat('🎬', finishedItems('Movie').length,
          'Movies Watched','movies')}

        ${stat('📺', finishedItems('Show').length,
          'Shows Watched','shows')}
      </div>

      <section class="shelfie-profile-section">
        <h2>♡ My TBR & Watchlist</h2>
        ${mediaCards(
          state.saved.map(id => item(id)).filter(Boolean)
        )}
      </section>

      <section class="shelfie-profile-section">
        <h2>✦ My Activity</h2>

        ${recent.length ? recent.map(a => `
          <div class="shelfie-activity-entry">
            <div class="eyebrow">
              ${a.kind === 'comment'
                ? '💬 Commented'
                : '♧ Group post'}
            </div>
            <p>${esc(a.text)}</p>
            <div class="subtle">
              ${esc(a.title || '')}
              · ${esc(a.date || '')}
            </div>
            <button class="linkbtn"
              onclick="shelfieOpenActivity(
                '${a.kind}',
                '${a.target}'
              )">
              View conversation →
            </button>
          </div>
        `).join('') :
          '<div class="empty">Your activity will appear here ♡</div>'
        }
      </section>

      <button class="secondary full"
        onclick="openInvite()">
        ↗ Share my profile
      </button>
    `;
  };

  window.shelfieOpenActivity = function (kind, target) {
    if (kind === 'group') openGroup(target);
    else openDetail(target);
  };

  window.shelfieOpenStat = async function (kind) {
    loadAccount();

    if (kind === 'ratings') {
      modal('My Ratings ♡',
        mediaCards(
          state.reviews.map(r => item(r.id)).filter(Boolean)
        )
      );
      return;
    }

    if (kind === 'books') {
      modal('Books Read ♡',
        mediaCards(finishedItems('Book')));
      return;
    }

    if (kind === 'movies') {
      modal('Movies Watched ♡',
        mediaCards(finishedItems('Movie')));
      return;
    }

    if (kind === 'shows') {
      modal('Shows Watched ♡',
        mediaCards(finishedItems('Show')));
      return;
    }

    if (kind === 'groups') {
      modal('My Groups ♡',
        state.groups.length
          ? state.groups.map(g => `
            <button class="shelfie-book-button"
              style="margin-bottom:9px"
              onclick="openGroup('${g.id}')">
              ♧ ${esc(g.name)}
            </button>
          `).join('')
          : '<div class="empty">No groups joined yet ♡</div>'
      );
      return;
    }

    if (kind === 'friends') {
      if (!cloudUser) {
        openAccount();
        return;
      }

      modal('My Friends ♡',
        '<p class="muted">Loading friends...</p>');

      const { data, error } = await cloud
        .from('follows')
        .select('following_id')
        .eq('follower_id', cloudUser.id);

      if (error) {
        toast(error.message);
        return;
      }

      const ids = (data || []).map(f => f.following_id);

      if (!ids.length) {
        modal('My Friends ♡',
          '<div class="empty">No friends followed yet ♡</div>');
        return;
      }

      const result = await cloud
        .from('profiles')
        .select('id,username,display_name')
        .in('id', ids);

      if (result.error) {
        toast(result.error.message);
        return;
      }

      modal('My Friends ♡',
        (result.data || []).map(p => `
          <div class="socialresult">
            <b>${esc(p.display_name || p.username)}</b>
            <div class="muted">@${esc(p.username)}</div>
          </div>
        `).join('')
      );
    }
  };

  window.shelfieMarkFinished = function (id) {
    loadAccount();

    const finished = isFinished(id);

    state.completed = finished
      ? state.completed.filter(x => x !== id)
      : [...state.completed, id];

    if (!finished) {
      state.saved = state.saved.filter(x => x !== id);
    }

    save();
    openDetail(id);
    toast(finished
      ? 'Removed from completed ♡'
      : 'Added to completed ♡');
  };

  // Movies and shows get their own watched button.
  openDetail = function (id) {
    loadAccount();
    originalOpenDetail(id);

    const x = item(id);
    if (!x || x.type === 'Book') return;

    const modalBody = document.querySelector('.modal');
    if (!modalBody) return;

    const button = document.createElement('button');
    button.className = 'shelfie-book-button';
    button.style.marginTop = '12px';
    button.textContent = isFinished(id)
      ? '✓ Watched · Undo'
      : '✓ Mark as Watched';

    button.onclick = () => shelfieMarkFinished(id);
    modalBody.appendChild(button);
  };

  // Books already have a Read button.
  window.shelfieBookStatus = function (id, status) {
    loadAccount();

    if (status === 'read') {
      const wasRead = isFinished(id);
      state.completed = wasRead
        ? state.completed.filter(x => x !== id)
        : [...state.completed, id];

      save();
    }

    if (status === 'tbr') {
      state.completed =
        state.completed.filter(x => x !== id);
      save();
    }

    originalBookStatus(id, status);
  };

  submitReview = async function (id) {
    loadAccount();
    await originalSubmitReview(id);

    // Rating is separate from Read / Watched.
    save();
  };

  addComment = function (e, id) {
    loadAccount();

    const input = document.getElementById('commentText');
    const text = input?.value.trim();

    if (text) {
      state.activity.push({
        kind:'comment',
        target:id,
        title:item(id)?.title || 'Discussion',
        text,
        date:new Date().toLocaleDateString()
      });
    }

    originalAddComment(e, id);
    save();
  };

  postGroup = function (e, id) {
    loadAccount();

    const input = document.getElementById('groupPost');
    const text = input?.value.trim();

    if (text) {
      state.activity.push({
        kind:'group',
        target:id,
        title:state.groups.find(g => g.id === id)?.name ||
          'Group',
        text,
        date:new Date().toLocaleDateString()
      });
    }

    originalPostGroup(e, id);
    save();
  };

  createGroup = function (e) {
    loadAccount();
    originalCreateGroup(e);
    save();
  };

  render = function () {
    loadAccount();
    originalRender();
  };

  refreshCloud = async function () {
    await originalRefresh();
    loadAccount();
    render();
  };

  // The account-change listener in the existing app
  // calls refreshCloud after sign-in or sign-out.
  // Switching accounts now loads separate local data.
  loadAccount();
  render();
})();
</script>

           </div>`

  `);

const shelfiePreviousSearchFriends = searchFriends;

searchFriends = async function() {
  await shelfiePreviousSearchFriends();

  const results = document.getElementById('friendResults');
  if (!results) return;

  results.querySelectorAll('.socialresult').forEach(row => {
    const followButton = row.querySelector('button');
    const match = followButton?.getAttribute('onclick')
      ?.match(/toggleFollow\('([^']+)'\)/);

    if (!match) return;

    const friendId = match[1];
    const name = row.querySelector('b');

    if (name) {
      name.style.cursor = 'pointer';
      name.style.color = 'var(--pink)';
      name.setAttribute('role', 'button');
      name.setAttribute('tabindex', '0');
      name.onclick = () => shelfieViewFriend(friendId);
      name.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          shelfieViewFriend(friendId);
        }
      };
    }
  });
};

<script>
function shelfieUsernameFromEmail(email) {
  let name = (email || '')
    .split('@')[0]
    .toLowerCase()
    .replace(/[^a-z0-9_]/g, '');

  if (name.length < 3) {
    name = (name + 'reader').slice(0, 3);
  }

  return name.slice(0, 40);
}
</script>

<!-- ============================================================
     SHELFIE · 18 · Friend profiles, reviews and social activity
     ============================================================ -->
<script>
(function () {
  let friendProfile = null;
  let friendRatings = [];
  let friendFollowing = [];
  let friendPageVersion = 0;

  const previousRender = render;
  const previousGo = go;
  const previousViewFriend = window.shelfieViewFriend;

  function mediaId(value) {
    return String(value || '');
  }

  function getFriendBook(r) {
    let x = item(r.title_id);

    if (x) return x;

    const id = mediaId(r.title_id);
    const isBook = id.startsWith('openlibrary_');

    x = {
      id,
      title:r.title_name || 'Untitled',
      type:isBook ? 'Book' :
        (id.startsWith('m') ? 'Movie' :
        id.startsWith('s') ? 'Show' : 'Book'),
      year:'',
      genre:'',
      description:'',
      author:'',
      workKey:isBook
        ? '/works/' + id.replace('openlibrary_', '')
        : '',
      cover:'https://placehold.co/120x180/38213f/f8b5e4?text=Shelfie',
      fallback:'https://placehold.co/120x180/38213f/f8b5e4?text=Shelfie'
    };

    catalog.push(x);

    if (isBook) {
      fetch('https://openlibrary.org' + x.workKey + '.json')
        .then(response => response.ok ? response.json() : null)
        .then(data => {
          if (!data) return;
          x.description = typeof data.description === 'string'
            ? data.description
            : data.description?.value || '';
          if (data.covers?.[0]) {
            x.cover = 'https://covers.openlibrary.org/b/id/' +
              data.covers[0] + '-M.jpg';
          }
          if (tab === 'Friend') render();
        })
        .catch(() => {});
    }

    return x;
  }

  function friendHeader() {
    if (!friendProfile) {
      return '<div class="empty">Loading profile ♡</div>';
    }

    const p = friendProfile;
    const name = p.display_name || p.username || 'Shelfie member';
    const books = friendRatings.filter(r =>
      getFriendBook(r).type === 'Book'
    ).length;
    const movies = friendRatings.filter(r =>
      getFriendBook(r).type === 'Movie'
    ).length;
    const shows = friendRatings.filter(r =>
      getFriendBook(r).type === 'Show'
    ).length;

    function tile(symbol, count, label, kind) {
      return `<button class="shelfie-profile-stat"
        onclick="shelfieFriendSection('${kind}')">
        <span class="symbol">${symbol}</span>
        <strong>${count}</strong>
        <small>${label}</small>
      </button>`;
    }

    return `
      <button class="shelfie-friend-back"
        onclick="shelfieFriendBack()">← Back</button>

      <div class="profiletop">
        <div class="avatar">${esc(name[0])}</div>
        <h2 style="margin:0">${esc(name)}</h2>
        <div class="muted">@${esc(p.username)}</div>

        ${p.bio ? `<p class="shelfie-bio">${esc(p.bio)}</p>` : ''}
        ${p.status ? `
          <div class="shelfie-status">
            <div class="eyebrow">✦ MY STATUS</div>
            <p>${esc(p.status)}</p>
          </div>` : ''}

        ${cloudUser && cloudUser.id !== p.id ? `
          <button class="secondary"
            style="margin-top:13px"
            onclick="shelfieFriendFollow('${p.id}')">
            ${cloudFollowing.includes(p.id)
              ? '✓ Following · Unfollow'
              : '＋ Add Friend'}
          </button>` : ''}
      </div>

      <div class="shelfie-profile-stats">
        ${tile('♡',friendFollowing.length,'Friends','friends')}
        ${tile('★',friendRatings.length,'Ratings','ratings')}
        ${tile('♧','—','Groups','groups')}
        ${tile('📖',books,'Books Rated','books')}
        ${tile('🎬',movies,'Movies Rated','movies')}
        ${tile('📺',shows,'Shows Rated','shows')}
      </div>

      <section class="shelfie-profile-section">
        <h2>★ Their Reviews</h2>
        ${friendRatings.length
          ? friendMediaList(friendRatings)
          : '<div class="empty">No public reviews yet ♡</div>'}
      </section>
    `;
  }

  function friendMediaList(ratings) {
    if (!ratings.length) {
      return '<div class="empty">Nothing here yet ♡</div>';
    }

    return ratings.map(r => {
      const x = getFriendBook(r);
      const isBook = x.type === 'Book';
      const saved = state.saved.includes(x.id);

      return `
        <div class="shelfie-friend-list">
          <img class="shelfie-friend-list-cover"
            src="${esc(x.cover)}"
            alt="${esc(x.title)}"
            onclick="openDetail('${x.id}')"
            onerror="this.src='https://placehold.co/120x180/38213f/f8b5e4?text=Shelfie'">

          <div class="shelfie-friend-list-info"
            onclick="shelfieFriendItem('${x.id}')">
            <b>${esc(x.title)}</b>
            <small class="stars">
              ${'★'.repeat(r.stars)}
              ${'☆'.repeat(5-r.stars)}
            </small>
            ${r.review
              ? `<small style="display:block;margin-top:5px">
                  ${esc(r.review)}
                </small>`
              : ''}
            <small style="display:block;margin-top:5px;color:#f5a4df">
              View details →
            </small>
          </div>

          ${isBook ? `
            <button class="shelfie-friend-list-action ${saved?'saved':''}"
              onclick="shelfieFriendTBR('${x.id}')">
              ${saved ? '✓ In TBR' : '＋ TBR'}
            </button>` : ''}
        </div>
      `;
    }).join('');
  }

  window.shelfieFriendItem = function(id) {
    openDetail(id);

    const r = friendRatings.find(r => r.title_id === id);
    const body = document.querySelector('.modal');

    if (r && body) {
      const section = document.createElement('div');
      section.className = 'shelfie-about-text';
      section.innerHTML = `
        <b>${esc(friendProfile.display_name ||
          friendProfile.username)}'s review</b>
        <p class="stars">${'★'.repeat(r.stars)}
          ${'☆'.repeat(5-r.stars)}</p>
        <p>${esc(r.review || 'No written review.')}</p>
      `;
      body.appendChild(section);
    }
  };

  window.shelfieFriendTBR = function(id) {
    const x = item(id);
    if (!x || x.type !== 'Book') return;

    const saved = state.saved.includes(id);

    state.saved = saved
      ? state.saved.filter(bookId => bookId !== id)
      : [...state.saved, id];

    save();

    render();

    toast(saved
      ? 'Removed from your TBR ♡'
      : 'Added to your TBR ♡');
  };

  window.shelfieFriendBack = function() {
    friendPageVersion++;
    friendProfile = null;
    previousGo('Profile');
  };

  window.shelfieViewFriend = async function(id) {
    if (!cloud || !id) return;

    if (cloudUser?.id === id) {
      previousGo('Profile');
      return;
    }

    const version = ++friendPageVersion;

    friendProfile = null;
    friendRatings = [];
    friendFollowing = [];

    tab = 'Friend';
    sessionStorage.setItem('shelfie-current-page','Profile');
    render();
    window.scrollTo(0,0);

    const [profileResult, ratingResult, followResult] =
      await Promise.all([
        cloud.from('profiles')
          .select('id,username,display_name,bio,status')
          .eq('id',id).maybeSingle(),

        cloud.from('ratings')
          .select('id,title_id,title_name,stars,review,created_at')
          .eq('user_id',id)
          .order('created_at',{ascending:false}),

        cloud.from('follows')
          .select('following_id')
          .eq('follower_id',id)
      ]);

    if (version !== friendPageVersion) return;

    if (profileResult.error || !profileResult.data) {
      toast('Could not load this profile');
      shelfieFriendBack();
      return;
    }

    friendProfile = profileResult.data;
    friendRatings = ratingResult.data || [];
    friendFollowing = (followResult.data || [])
      .map(f => f.following_id);

    render();
  };

  window.shelfieFriendFollow = async function(id) {
    if (!cloudUser) {
      openAccount();
      return;
    }

    await toggleFollow(id);
    render();
  };

  window.shelfieFriendSection = async function(kind) {
    if (!friendProfile) return;

    if (kind === 'groups') {
      modal('Their Groups ♡', `
        <div class="empty">
          Public groups will appear here when
          group syncing is enabled ♡
        </div>
      `);
      return;
    }

    if (kind === 'friends') {
      modal('Their Friends ♡',
        '<p class="muted">Loading friends...</p>');

      if (!friendFollowing.length) {
        modal('Their Friends ♡',
          '<div class="empty">No friends to show yet ♡</div>');
        return;
      }

      const {data,error} = await cloud.from('profiles')
        .select('id,username,display_name')
        .in('id',friendFollowing);

      if (error) {
        toast(error.message);
        return;
      }

      modal('Their Friends ♡',
        (data || []).map(p => `
          <div class="shelfie-friend-list">
            <div class="avatar"
              onclick="shelfieViewFriend('${p.id}')">
              ${esc((p.display_name || p.username)[0])}
            </div>

            <div class="shelfie-friend-list-info"
              onclick="shelfieViewFriend('${p.id}')">
              <b>${esc(p.display_name || p.username)}</b>
              <small>@${esc(p.username)}</small>
              <small style="display:block;color:#f5a4df">
                View profile →
              </small>
            </div>

            ${cloudUser?.id !== p.id ? `
              <button class="shelfie-friend-list-action"
                onclick="shelfieFriendFollowFromList('${p.id}')">
                ${cloudFollowing.includes(p.id)
                  ? '✓ Following'
                  : '＋ Friend'}
              </button>` : ''}
          </div>
        `).join('') ||
        '<div class="empty">No profiles found ♡</div>');
      return;
    }

    let list = friendRatings;

    if (kind === 'books') {
      list = list.filter(r =>
        getFriendBook(r).type === 'Book');
    } else if (kind === 'movies') {
      list = list.filter(r =>
        getFriendBook(r).type === 'Movie');
    } else if (kind === 'shows') {
      list = list.filter(r =>
        getFriendBook(r).type === 'Show');
    }

    const labels = {
      ratings:'Their Ratings ♡',
      books:'Their Books ♡',
      movies:'Their Movies ♡',
      shows:'Their Shows ♡'
    };

    modal(labels[kind] || 'Shelfie ♡',
      friendMediaList(list));
  };

  window.shelfieFriendFollowFromList = async function(id) {
    if (!cloudUser) {
      openAccount();
      return;
    }

    await toggleFollow(id);
    await shelfieFriendSection('friends');
  };

<script>
(function () {
  const originalFriendSection = window.shelfieFriendSection;

  function updateMovieButtons() {
    document.querySelectorAll('.shelfie-friend-list').forEach(row => {
      const info = row.querySelector('.shelfie-friend-list-info');
      if (!info) return;

      const onclick = info.getAttribute('onclick') || '';
      const match = onclick.match(/shelfieFriendItem\('([^']+)'\)/);
      if (!match) return;

      const id = match[1];
      const movie = item(id);
      if (!movie || movie.type !== 'Movie') return;

      let button = row.querySelector('.shelfie-friend-list-action');

      if (!button) {
        button = document.createElement('button');
        button.className = 'shelfie-friend-list-action';
        row.appendChild(button);
      }

      const saved = state.saved.includes(id);

      button.textContent = saved ? '✓ In Watchlist' : '＋ Watchlist';
      button.classList.toggle('saved', saved);

      button.onclick = function(event) {
        event.stopPropagation();

        const alreadySaved = state.saved.includes(id);

        state.saved = alreadySaved
          ? state.saved.filter(savedId => savedId !== id)
          : [...state.saved, id];

        save();

        updateMovieButtons();

        toast(alreadySaved
          ? 'Removed from your Watchlist ♡'
          : 'Added to your Watchlist ♡');
      };
    });
  }

  window.shelfieFriendSection = async function(kind) {
    await originalFriendSection(kind);

    if (kind === 'movies' || kind === 'ratings') {
      updateMovieButtons();
    }
  };

  const originalRender = render;

  render = function() {
    originalRender();

    if (tab === 'Friend') {
      updateMovieButtons();
    }
  };
})();
</script>

<script>
(function () {
  const KEY = 'shelfie-viewing-friend';

  const originalViewFriend = window.shelfieViewFriend;

  window.shelfieViewFriend = async function(id) {
    if (id && id !== cloudUser?.id) {
      sessionStorage.setItem(KEY, id);
    }
    return originalViewFriend(id);
  };

  const originalFriendBack = window.shelfieFriendBack;

  window.shelfieFriendBack = function() {
    sessionStorage.removeItem(KEY);
    return originalFriendBack();
  };

  const originalGo = go;

  go = function(page) {
    sessionStorage.removeItem(KEY);
    return originalGo(page);
  };

  // Restore the same friend's profile after refreshing.
  async function restoreFriendProfile() {
    const id = sessionStorage.getItem(KEY);
    if (!id) return;

    // Wait for Supabase to restore the signed-in session.
    for (let attempt = 0; attempt < 40; attempt++) {
      if (cloud && cloudUser) {
        if (cloudUser.id === id) {
          sessionStorage.removeItem(KEY);
          return;
        }

        await window.shelfieViewFriend(id);
        return;
      }

      await new Promise(resolve => setTimeout(resolve, 250));
    }
  }

  restoreFriendProfile();
})();
</script>

<script>
(function () {
  let activeGroupId = null;
  const GROUP_KEY = 'shelfie-open-group';

  const originalOpenGroup = openGroup;
  const originalRender = render;
  const originalGo = go;

  function showGroupPage() {
    if (!activeGroupId) return;

    const group = (state.groups || [])
      .find(g => String(g.id) === String(activeGroupId));

    if (!group) {
      activeGroupId = null;
      sessionStorage.removeItem(GROUP_KEY);
      return;
    }

    const screen = document.getElementById('screen');
    if (!screen) return;

    screen.innerHTML = `
      <div class="shelfie-group-page">
        <button class="shelfie-group-back"
          onclick="shelfieGroupBack()">← Back to Groups</button>

        <div class="muted">
          ♧ ${(group.members || []).length} members
        </div>

        <div class="shelfie-group-panel">
          <h2>Group chat 💬</h2>
          <div id="shelfie-group-chat-content"></div>
        </div>
      </div>
    `;

    // Reuse the existing group chat, including its post form.
    originalOpenGroup(activeGroupId);

    const modalElement = document.querySelector(
      '#overlay .modal'
    );

    if (modalElement) {
      const modalBody = modalElement.cloneNode(true);
      const modalHeader = modalBody.querySelector('.modalhead');
      if (modalHeader) modalHeader.remove();

      const target = document.getElementById(
        'shelfie-group-chat-content'
      );

      target.innerHTML = modalBody.innerHTML;
    }

    closeModal();
  }

  openGroup = function(id) {
    activeGroupId = id;
    sessionStorage.setItem(GROUP_KEY, String(id));
    closeModal();
    tab = 'Groups';
    originalRender();
    showGroupPage();
    window.scrollTo(0,0);
  };

  window.shelfieGroupBack = function() {
    activeGroupId = null;
    sessionStorage.removeItem(GROUP_KEY);
    originalGo('Groups');
  };

  render = function() {
    originalRender();

    if (activeGroupId && tab === 'Groups') {
      showGroupPage();
    }
  };

  go = function(page) {
    activeGroupId = null;
    sessionStorage.removeItem(GROUP_KEY);
    originalGo(page);
  };

  // Reopen the same group after a refresh.
  const savedGroup = sessionStorage.getItem(GROUP_KEY);

  if (savedGroup) {
    activeGroupId = savedGroup;
    tab = 'Groups';

    const restore = setInterval(() => {
      if (!document.getElementById('screen')) return;

      clearInterval(restore);
      showGroupPage();
    }, 200);

    setTimeout(() => clearInterval(restore), 5000);
  }
})();
</script>

<!-- ============================================================
     SHELFIE · 24 · Group chat presentation
     ============================================================ -->
<script>
(function () {
  function upgradeGroupChat() {
    const content = document.getElementById(
      'shelfie-group-chat-content'
    );
    if (!content) return;

    // Find the message area between the conversation
    // heading and the message input.
    const textarea = content.querySelector('textarea');
    if (!textarea) return;

    const all = [...content.querySelectorAll('*')];

    const heading = all.find(el =>
      el.children.length === 0 &&
      el.textContent.trim() === 'Group chat 💬'
    );

    // Find the container holding existing messages.
    const candidates = [...content.querySelectorAll('div')]
      .filter(el =>
        el !== content &&
        el.contains(heading) === false &&
        !el.contains(textarea) &&
        el.querySelectorAll('p').length > 0
      );

    const messageContainer = candidates.find(el =>
      [...el.children].some(child =>
        child.textContent.includes('Yagmur')
      )
    );

    if (!messageContainer ||
        messageContainer.classList.contains('shelfie-chat-scroll')) {
      return;
    }

    messageContainer.classList.add('shelfie-chat-scroll');

    const messages = [...messageContainer.children]
      .filter(el => el.textContent.trim());

    messages.forEach(message => {
      message.classList.add('shelfie-chat-message');

      // Existing group messages may not have saved timestamps.
      // Only show a date when one is available.
      const timestamp =
        message.getAttribute('data-created-at') ||
        message.getAttribute('data-time');

      if (timestamp && !message.querySelector('.shelfie-chat-time')) {
        const date = new Date(timestamp);

        if (!isNaN(date.getTime())) {
          const time = document.createElement('span');
          time.className = 'shelfie-chat-time';
          time.textContent = date.toLocaleString([], {
            month:'short',
            day:'numeric',
            hour:'numeric',
            minute:'2-digit'
          });
          message.appendChild(time);
        }
      }

      let startX = 0;
      let startY = 0;

      message.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive:true});

      message.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;

        if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
          message.classList.toggle('swiped', dx < 0);
        }
      }, {passive:true});
    });

    // Show the most recent messages first on opening.
    messageContainer.scrollTop = messageContainer.scrollHeight;
  }

  const oldRender = render;

  render = function() {
    oldRender();
    upgradeGroupChat();
  };

  const oldOpenGroup = openGroup;

  openGroup = function(id) {
    oldOpenGroup(id);
    upgradeGroupChat();
  };

  upgradeGroupChat();
})();
</script>

  };

  window.shelfieSavePoll = function (event) {
    event.preventDefault();

    const group = activeGroup();
    if (!group) return;

    const question =
      document.getElementById('pollQuestion').value.trim();

    const options = [...document.querySelectorAll('.pollOption')]
      .map(input => input.value.trim())
      .filter(Boolean);

    if (options.length < 2) {
      toast('Add at least two titles ♡');
      return;
    }

    group.polls ||= [];
    group.polls.push({
      id:'poll_' + Date.now(),
      question,
      options,
      votes:{}
    });

    save();
    closeModal();
    addPollsToGroup();
    toast('Poll created! ♡');
  };

  window.shelfieVotePoll = function (pollId, index) {
    const group = activeGroup();
    const poll = group?.polls?.find(p => p.id === pollId);
    if (!poll) return;

    poll.votes ||= {};
    poll.votes[cloudUser?.id || 'guest'] = index;

    save();
    addPollsToGroup();
    toast('Your vote was saved ♡');
  };

  render = function () {
    oldRender();
    addPollsToGroup();
  };

  const oldOpenGroup = openGroup;

  openGroup = function (id) {
    oldOpenGroup(id);
    addPollsToGroup();
  };

  addPollsToGroup();
})();
</script>

<!-- ============================================================
     SHELFIE · 30 · Shared group chat and real-time messaging
     ============================================================ -->
<script>
(function () {
  let activeSharedGroup = null;
  let sharedMessages = [];
  let sharedChannel = null;
  let pageVersion = 0;

  const oldRender = render;
  const oldGo = go;

  function leaveSharedGroup() {
    pageVersion++;
    activeSharedGroup = null;

    if (sharedChannel && cloud) {
      cloud.removeChannel(sharedChannel);
      sharedChannel = null;
    }
  }

  function sharedPage() {
    if (!activeSharedGroup) return;

    const screen = document.getElementById('screen');
    if (!screen) return;

    screen.innerHTML = `
      <div class="shelfie-group-page">
        <button class="shelfie-group-back"
          onclick="shelfieSharedBack()">
          ← Back to Groups
        </button>

        <h1>${esc(activeSharedGroup.name)} ♡</h1>

        <div class="muted">
          ${activeSharedGroup.visibility === 'private'
            ? '🔒 Private group'
            : '♡ Public group'}
        </div>

        <div class="shelfie-group-panel">
          <h2>Group chat 💬</h2>

          <div class="shelfie-bubble-list"
            id="shelfieSharedMessages">
            ${sharedMessages.length
              ? sharedMessages.map(m => `
                <div class="shelfie-bubble-row
                  ${m.sender_id === cloudUser?.id ? 'mine' : ''}">
                  <span class="shelfie-bubble-name">
                    ${m.sender_id === cloudUser?.id
                      ? 'You'
                      : 'Member'}
                  </span>
                  <div class="shelfie-bubble">
                    ${esc(m.body)}
                  </div>
                </div>
              `).join('')
              : '<div class="empty">Start the conversation ♡</div>'}
          </div>

          <form class="shelfie-chat-compose"
            onsubmit="shelfieSendSharedMessage(event)">
            <textarea id="shelfieSharedInput"
              maxlength="2000"
              required
              placeholder="Message your group..."></textarea>

            <button class="primary full" type="submit">
              Send ♡
            </button>
          </form>
        </div>
      </div>
    `;

    const list = document.getElementById('shelfieSharedMessages');
    if (list) list.scrollTop = list.scrollHeight;
  }

  async function loadMessages(version) {
    if (!activeSharedGroup) return;

    const { data, error } = await cloud
      .from('shelfie_group_messages')
      .select('id,group_id,sender_id,body,created_at')
      .eq('group_id', activeSharedGroup.id)
      .order('created_at', { ascending: true });

    if (version !== pageVersion) return;

    if (error) {
      toast('Could not load messages: ' + error.message);
      return;
    }

    sharedMessages = data || [];
    sharedPage();
  }

  window.shelfieOpenSharedGroup = async function(id) {
    if (!cloud || !cloudUser) {
      openAccount();
      return;
    }

    leaveSharedGroup();

    const version = pageVersion;

    const { data: group, error } = await cloud
      .from('shelfie_groups')
      .select('*')
      .eq('id', id)
      .single();

    if (version !== pageVersion) return;

    if (error || !group) {
      toast('Could not open group ♡');
      return;
    }

    activeSharedGroup = group;
    sharedMessages = [];
    closeModal();
    tab = 'Groups';
    sharedPage();
    window.scrollTo(0, 0);

    await loadMessages(version);

    if (version !== pageVersion) return;

    sharedChannel = cloud
      .channel('shelfie-chat-' + id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'shelfie_group_messages',
        filter: 'group_id=eq.' + id
      }, () => loadMessages(version))
      .subscribe();
  };

  window.shelfieSendSharedMessage = async function(event) {
    event.preventDefault();

    if (!activeSharedGroup || !cloudUser) return;

    const input = document.getElementById('shelfieSharedInput');
    const body = input?.value.trim();
    if (!body) return;

    const groupId = activeSharedGroup.id;
    const version = pageVersion;

    const { error } = await cloud
      .from('shelfie_group_messages')
      .insert({
        group_id: groupId,
        sender_id: cloudUser.id,
        body
      });

    if (error) {
      toast('Could not send: ' + error.message);
      return;
    }

    if (version !== pageVersion) return;

    input.value = '';
    await loadMessages(version);
  };

  window.shelfieSharedBack = function() {
    leaveSharedGroup();
    oldGo('Groups');
  };

  render = function() {
    oldRender();

    if (activeSharedGroup && tab === 'Groups') {
      sharedPage();
    }
  };

  go = function(page) {
    leaveSharedGroup();
    oldGo(page);
  };
})();
</script>

<script>
window.shelfieJoinGroup = async function(groupId) {
  if (!cloudUser || !cloud) {
    toast('Sign in to join a group ♡');
    openAccount();
    return;
  }

  const { data: group, error: groupError } = await cloud
    .from('shelfie_groups')
    .select('id,visibility')
    .eq('id', groupId)
    .single();

  if (groupError || !group) {
    toast('Could not find this group ♡');
    return;
  }

  if (group.visibility !== 'public') {
    toast('This group requires an invitation ♡');
    return;
  }

  const { error } = await cloud
    .from('shelfie_group_members')
    .upsert({
      group_id: groupId,
      user_id: cloudUser.id,
      role: 'member'
    }, {
      onConflict: 'group_id,user_id',
      ignoreDuplicates: true
    });

  if (error) {
    toast('Could not join: ' + error.message);
    return;
  }

  toast('You joined the group! ♡');

  if (typeof shelfieLoadSharedGroups === 'function') {
    await shelfieLoadSharedGroups();
  }

  render();
};
</script>

<script>
window.shelfieReviewRequest = async function(requestId, approve) {
  if (!cloud || !cloudUser) return;

  const { error } = await cloud.rpc(
    'shelfie_review_group_request',
    {
      p_request_id: requestId,
      p_approve: approve
    }
  );

  if (error) {
    alert('Could not review request: ' + error.message);
    return;
  }

  shelfieOpenNotifications();
};

window.shelfieOpenNotifications = async function() {
  if (!cloud || !cloudUser) {
    modal('Notifications ♡', '<p>Please sign in ♡</p>');
    return;
  }

  modal('Notifications ♡', '<p>Loading notifications... ♡</p>');

  const { data, error } = await cloud
    .from('shelfie_notifications')
    .select('id,type,message,group_id,actor_id,is_read,created_at')
    .eq('user_id', cloudUser.id)
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    modal('Notifications ♡', '<p>Could not load notifications ♡</p>');
    return;
  }

  const notifications = data || [];

  const requests = notifications.filter(n =>
    n.type === 'group_request'
  );

  const requestGroups = [...new Set(
    requests.map(n => n.group_id).filter(Boolean)
  )];

  let pendingRequests = [];

  if (requestGroups.length) {
    const result = await cloud
      .from('shelfie_group_requests')
      .select('id,group_id,user_id,status')
      .in('group_id', requestGroups)
      .eq('status', 'pending');

    if (result.error) {
      modal('Notifications ♡',
        '<p>Could not load group requests ♡</p>');
      return;
    }

    pendingRequests = result.data || [];
  }

  const content = notifications.map(n => {
    const request = n.type === 'group_request'
      ? pendingRequests.find(r =>
          r.group_id === n.group_id &&
          r.user_id === n.actor_id
        )
      : null;

    if (n.type === 'group_request' && !request) return '';

    return `
      <div style="
        background:#39203F;
        border:1px solid #68436C;
        border-radius:15px;
        padding:15px;
        margin-bottom:10px;
        color:#F9E9F6;
      ">
        <p style="margin:0 0 12px">
          ${esc(n.message || 'New notification ♡')}
        </p>

        ${request ? `
          <div style="display:flex;gap:10px">
            <button
              onclick="shelfieReviewRequest('${request.id}',true)"
              style="flex:1;background:#E99AD2;color:#261329;
              border:0;border-radius:12px;padding:12px">
              Approve ♡
            </button>

            <button
              onclick="shelfieReviewRequest('${request.id}',false)"
              style="flex:1;background:#241429;color:#E99AD2;
              border:1px solid #E99AD2;border-radius:12px;padding:12px">
              Decline
            </button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  modal(
    'Notifications ♡',
    content.trim() ||
    '<p style="text-align:center;color:#E99AD2;padding:25px">No notifications yet ♡</p>'
  );
};
</script>

<script>
(function () {
  function updateGroupCount() {
    if (typeof tab === 'undefined' || tab !== 'Groups') return;

    const screen = document.getElementById('screen');
    if (!screen) return;

    const heading = [...screen.querySelectorAll('*')]
      .find(el =>
        el.children.length === 0 &&
        el.textContent.trim() === "Groups you're in"
      );

    if (!heading) return;

    const row = heading.parentElement;
    if (!row) return;

    const counter = [...row.querySelectorAll('*')]
      .find(el =>
        el.children.length === 0 &&
        /^\d+\s+groups?$/.test(el.textContent.trim())
      );

    if (!counter) return;

    const localCount = Array.isArray(state?.groups)
      ? state.groups.length
      : 0;

    const sharedCount = screen.querySelectorAll(
      '.shelfie-profile-section button.shelfie-book-button'
    ).length;

    const total = localCount + sharedCount;

    const label = `${total} ${total === 1 ? 'group' : 'groups'}`;

    if (counter.textContent !== label) {
      counter.textContent = label;
    }
  }

  const screen = document.getElementById('screen');

  if (screen) {
    new MutationObserver(updateGroupCount).observe(screen, {
      childList: true,
      subtree: true
    });
  }

  updateGroupCount();
})();
</script>

<script>
(function () {
  let myGroupIds = [];
  let myBookRatings = [];

  async function syncProfileStats() {
    if (!cloud || !cloudUser || tab !== 'Profile') return;

    const userId = cloudUser.id;

    const [groups, ratings] = await Promise.all([
      cloud.from('shelfie_group_members')
        .select('group_id')
        .eq('user_id', userId),

      cloud.from('ratings')
        .select('title_id,title_name,stars,review')
        .eq('user_id', userId)
    ]);

    if (cloudUser?.id !== userId) return;

    if (groups.error) {
      console.error('Group count error:', groups.error);
    } else {
      myGroupIds = [...new Set(
        (groups.data || []).map(g => g.group_id)
      )];
    }

    if (ratings.error) {
      console.error('Book count error:', ratings.error);
    } else {
      myBookRatings = (ratings.data || []).filter(r => {
        const x = item(r.title_id);
        return x?.type === 'Book' ||
          String(r.title_id).startsWith('openlibrary_');
      });
    }

    const cards = document.querySelectorAll(
      '#screen .shelfie-profile-stats .shelfie-profile-stat'
    );

    if (tab !== 'Profile' || cards.length !== 6) return;

    if (!groups.error) {
      cards[2].querySelector('strong').textContent =
        myGroupIds.length;
    }

    if (!ratings.error) {
      cards[3].querySelector('strong').textContent =
        myBookRatings.length;
    }
  }

  const oldRender = render;

  render = function () {
    oldRender();
    if (tab === 'Profile') syncProfileStats();
  };

  const oldOpenStat = window.shelfieOpenStat;

  window.shelfieOpenStat = async function(kind) {
    if (kind !== 'groups' && kind !== 'books') {
      return oldOpenStat(kind);
    }

    await syncProfileStats();

    if (kind === 'groups') {
      const {data, error} = await cloud
        .from('shelfie_groups')
        .select('id,name')
        .in('id', myGroupIds.length
          ? myGroupIds
          : ['00000000-0000-0000-0000-000000000000']);

      if (error) {
        toast('Could not load groups ♡');
        return;
      }

      modal('My Groups ♡',
        (data || []).map(g => `
          <button class="shelfie-book-button"
            style="margin-bottom:10px;text-align:left"
            onclick="shelfieOpenSharedGroup('${g.id}')">
            ♧ ${esc(g.name)} →
          </button>
        `).join('') ||
        '<div class="empty">No groups yet ♡</div>'
      );
      return;
    }

    if (kind === 'books') {
      modal('Books Read ♡',
        myBookRatings.map(r => `
          <button class="shelfie-book-button"
            style="margin-bottom:10px;text-align:left"
            onclick="openDetail('${esc(r.title_id)}')">
            📖 ${esc(r.title_name || 'Untitled')}
            <div style="color:#F5A4DF;margin-top:5px">
              ${'★'.repeat(Math.min(5,Math.max(0,r.stars || 0)))}
            </div>
            <div class="muted">
              ${esc(r.review || '')}
            </div>
          </button>
        `).join('') ||
        '<div class="empty">No rated books yet ♡</div>'
      );
    }
  };

  syncProfileStats();
})();
</script>
